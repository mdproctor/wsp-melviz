<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Inter, system-ui, sans-serif">
  <style>
    .cell { stroke-width: 1.5; rx: 4; ry: 4; }
    .label { font-size: 14px; font-weight: 600; text-anchor: middle; fill: #fff; }
    .small { font-size: 10px; text-anchor: middle; fill: #94a3b8; }
    .title { font-size: 13px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
    .anno { font-size: 10px; fill: #64748b; text-anchor: start; }
  </style>

  <!-- Left side: BEFORE (blocked) -->
  <text x="150" y="24" class="title">Before — menu blocked</text>

  <!-- Grid row 1 -->
  <rect x="20" y="40" width="130" height="80" class="cell" fill="#ef4444" stroke="#fca5a5"/>
  <text x="85" y="85" class="label">A</text>
  <rect x="160" y="40" width="130" height="80" class="cell" fill="#eab308" stroke="#fde047"/>
  <text x="225" y="85" class="label">C</text>

  <!-- Action menu descending from C -->
  <rect x="230" y="92" width="64" height="50" rx="4" ry="4" fill="#1e1b2e" stroke="#7c3aed" stroke-width="1"/>
  <text x="262" y="108" fill="#c4b5fd" font-size="10" text-anchor="middle">⬌  ⬍  ⊞</text>
  <text x="262" y="126" fill="#c4b5fd" font-size="10" text-anchor="middle">✕  +</text>

  <!-- Grid row 2 — E overlaps the menu -->
  <rect x="20" y="130" width="130" height="80" class="cell" fill="#06b6d4" stroke="#67e8f9" opacity="0.9"/>
  <text x="85" y="175" class="label">E</text>
  <rect x="160" y="130" width="130" height="80" class="cell" fill="#3b82f6" stroke="#93c5fd"/>
  <text x="225" y="175" class="label">F</text>

  <!-- Red X over the menu -->
  <line x1="230" y1="92" x2="294" y2="142" stroke="#ef4444" stroke-width="3" opacity="0.8"/>
  <line x1="294" y1="92" x2="230" y2="142" stroke="#ef4444" stroke-width="3" opacity="0.8"/>

  <text x="150" y="240" class="small">E (z-index: auto) paints over C's menu</text>
  <text x="150" y="256" class="small">Playwright: "&lt;div&gt;E&lt;/div&gt; intercepts pointer events"</text>

  <!-- Right side: AFTER (fixed) -->
  <text x="450" y="24" class="title">After — z-index: 20 on selected</text>

  <!-- Grid row 1 -->
  <rect x="320" y="40" width="130" height="80" class="cell" fill="#ef4444" stroke="#fca5a5"/>
  <text x="385" y="85" class="label">A</text>
  <rect x="460" y="40" width="130" height="80" class="cell" fill="#eab308" stroke="#fde047" stroke-width="2.5"/>
  <text x="525" y="85" class="label">C</text>

  <!-- Action menu — now visible above E -->
  <rect x="530" y="92" width="64" height="50" rx="4" ry="4" fill="#1e1b2e" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="562" y="108" fill="#c4b5fd" font-size="10" text-anchor="middle">⬌  ⬍  ⊞</text>
  <text x="562" y="126" fill="#c4b5fd" font-size="10" text-anchor="middle">✕  +</text>

  <!-- Grid row 2 — E is behind now -->
  <rect x="320" y="130" width="130" height="80" class="cell" fill="#06b6d4" stroke="#67e8f9" opacity="0.5"/>
  <text x="385" y="175" class="label" opacity="0.6">E</text>
  <rect x="460" y="130" width="130" height="80" class="cell" fill="#3b82f6" stroke="#93c5fd" opacity="0.5"/>
  <text x="525" y="175" class="label" opacity="0.6">F</text>

  <!-- Green check -->
  <text x="568" y="84" font-size="16" fill="#22c55e">✓</text>

  <text x="450" y="240" class="small">Selected item elevated — menu paints above siblings</text>
  <text x="450" y="256" class="small">data-grid-edit-button skips drag interception</text>

  <!-- Divider -->
  <line x1="300" y1="30" x2="300" y2="270" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
</svg>