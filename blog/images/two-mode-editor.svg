<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #e5e5e5; }
    .label { font-size: 11px; fill: #a3a3a3; }
    .small { font-size: 10px; fill: #737373; }
    .box { rx: 6; }
  </style>
  <!-- Layout Mode -->
  <rect x="20" y="20" width="320" height="300" fill="#1a1a2e" class="box"/>
  <text x="180" y="50" text-anchor="middle" class="title">Layout Mode</text>
  <text x="180" y="70" text-anchor="middle" class="small">Design the grid structure</text>
  <!-- Grid skeleton -->
  <rect x="40" y="90" width="140" height="80" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" class="box"/>
  <rect x="190" y="90" width="130" height="80" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" class="box"/>
  <rect x="40" y="180" width="280" height="40" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" class="box"/>
  <rect x="40" y="230" width="130" height="60" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" class="box"/>
  <rect x="180" y="230" width="140" height="60" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" class="box"/>
  <text x="110" y="135" text-anchor="middle" class="label">empty</text>
  <text x="255" y="135" text-anchor="middle" class="label">empty</text>
  <text x="180" y="205" text-anchor="middle" class="label">empty</text>
  <text x="105" y="265" text-anchor="middle" class="label">empty</text>
  <text x="250" y="265" text-anchor="middle" class="label">empty</text>
  <!-- Operations -->
  <text x="60" y="310" class="small">split · merge · resize · add row</text>
  <!-- Arrow -->
  <path d="M 355 170 L 385 170" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker></defs>
  <!-- Content Mode -->
  <rect x="400" y="20" width="300" height="300" fill="#1a1a2e" class="box"/>
  <text x="550" y="50" text-anchor="middle" class="title">Content Mode</text>
  <text x="550" y="70" text-anchor="middle" class="small">Fill containers with components</text>
  <!-- Filled grid -->
  <rect x="420" y="90" width="130" height="80" fill="#1a6b5a" class="box"/>
  <text x="485" y="135" text-anchor="middle" class="label" fill="#e5e5e5">Chart</text>
  <rect x="560" y="90" width="120" height="80" fill="#2563eb" class="box"/>
  <text x="620" y="135" text-anchor="middle" class="label" fill="#e5e5e5">Table</text>
  <rect x="420" y="180" width="260" height="40" fill="#9333ea" class="box"/>
  <text x="550" y="205" text-anchor="middle" class="label" fill="#e5e5e5">KPI Strip</text>
  <rect x="420" y="230" width="120" height="60" fill="#dc2626" class="box"/>
  <text x="480" y="265" text-anchor="middle" class="label" fill="#e5e5e5">Form</text>
  <rect x="550" y="230" width="130" height="60" fill="#0891b2" class="box"/>
  <text x="615" y="265" text-anchor="middle" class="label" fill="#e5e5e5">Timeline</text>
  <!-- Operations -->
  <text x="435" y="310" class="small">drag · swap · replace · expand</text>
</svg>
