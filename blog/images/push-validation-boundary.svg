<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Request Validation at the System Boundary</text>

  <!-- Caller box -->
  <rect x="20" y="60" width="120" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="82" text-anchor="middle" font-weight="500" fill="#334155">Caller</text>
  <text x="80" y="98" text-anchor="middle" font-size="11" fill="#64748b">HTTP POST</text>

  <!-- PushPublishResource box -->
  <rect x="200" y="45" width="200" height="80" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="300" y="68" text-anchor="middle" font-weight="600" fill="#1e40af">PushPublishResource</text>

  <!-- Validation gate inside resource -->
  <rect x="215" y="78" width="170" height="36" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="300" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#92400e">MAPPER.readTree(body)</text>

  <!-- static final MAPPER note -->
  <rect x="210" y="145" width="190" height="30" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="305" y="164" text-anchor="middle" font-size="11" fill="#166534">static final ObjectMapper MAPPER</text>
  <text x="305" y="178" font-size="10" text-anchor="middle" fill="#6b7280">thread-safe · shared · zero per-request cost</text>

  <!-- EventBroadcaster box -->
  <rect x="460" y="60" width="120" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="520" y="82" text-anchor="middle" font-weight="500" fill="#334155">Broadcaster</text>
  <text x="520" y="98" text-anchor="middle" font-size="11" fill="#64748b">broadcast()</text>

  <!-- Subscribers -->
  <rect x="640" y="48" width="60" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="670" y="64" text-anchor="middle" font-size="10" fill="#64748b">Sub 1</text>
  <rect x="640" y="78" width="60" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="670" y="94" text-anchor="middle" font-size="10" fill="#64748b">Sub 2</text>
  <rect x="640" y="108" width="60" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="670" y="124" text-anchor="middle" font-size="10" fill="#64748b">Sub N</text>

  <!-- Happy path arrows -->
  <line x1="140" y1="85" x2="195" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="85" x2="455" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="62" x2="635" y2="62" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="580" y1="90" x2="635" y2="90" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="580" y1="118" x2="635" y2="118" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Labels on arrows -->
  <text x="167" y="78" text-anchor="middle" font-size="10" fill="#64748b">JSON?</text>
  <text x="428" y="78" text-anchor="middle" font-size="10" fill="#64748b">valid ✓</text>

  <!-- Reject path -->
  <path d="M300,125 L300,230" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <rect x="230" y="240" width="140" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="300" y="258" text-anchor="middle" font-weight="500" fill="#dc2626">400 Bad Request</text>
  <text x="300" y="272" text-anchor="middle" font-size="10" fill="#991b1b">invalid JSON</text>

  <!-- Reject label -->
  <text x="314" y="210" font-size="10" fill="#dc2626">invalid ✗</text>

  <!-- Boundary line -->
  <line x1="190" y1="38" x2="190" y2="300" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="192" y="310" font-size="10" fill="#3b82f6" font-style="italic">system boundary</text>
</svg>