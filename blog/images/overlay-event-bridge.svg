<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="350" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Event Bridge Pattern</text>

  <!-- Controller box -->
  <rect x="20" y="45" width="160" height="55" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="100" y="67" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Controller</text>
  <text x="100" y="83" text-anchor="middle" font-size="10" fill="#64748b">action button click</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="72" x2="240" y2="72" stroke="#64748b" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="210" y="64" text-anchor="middle" font-size="9" fill="#64748b">bubbles</text>

  <!-- Grid element -->
  <rect x="245" y="50" width="120" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="305" y="70" text-anchor="middle" font-size="11" fill="#334155">gridEl</text>
  <text x="305" y="83" text-anchor="middle" font-size="9" fill="#64748b">pages-grid-action</text>

  <!-- Arrow 2 -->
  <line x1="365" y1="72" x2="415" y2="72" stroke="#64748b" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="390" y="64" text-anchor="middle" font-size="9" fill="#64748b">composed</text>

  <!-- Shell bridge -->
  <rect x="420" y="45" width="130" height="55" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="485" y="67" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Shell</text>
  <text x="485" y="83" text-anchor="middle" font-size="10" fill="#64748b">_gridActionHandler</text>

  <!-- Arrow 3 -->
  <line x1="550" y1="72" x2="590" y2="72" stroke="#64748b" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="570" y="64" text-anchor="middle" font-size="9" fill="#64748b">translates</text>

  <!-- Overlay root -->
  <rect x="595" y="45" width="90" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="640" y="67" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">overlay</text>
  <text x="640" y="83" text-anchor="middle" font-size="10" fill="#64748b">selection-*</text>

  <!-- Existing handlers label -->
  <rect x="560" y="120" width="170" height="40" rx="4" fill="#fefce8" stroke="#fde68a"/>
  <text x="645" y="138" text-anchor="middle" font-size="10" fill="#713f12">Existing handlers</text>
  <text x="645" y="152" text-anchor="middle" font-size="10" fill="#713f12">unchanged</text>
  <line x1="640" y1="100" x2="640" y2="120" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
