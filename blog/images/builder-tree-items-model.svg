<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="system-ui, sans-serif">
  <text x="350" y="24" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">Builder tree: placement → component hierarchy</text>

  <!-- Tree structure -->
  <rect x="20" y="40" width="300" height="280" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="30" y="62" font-size="12" font-weight="600" fill="#6b7280">TREE VIEW</text>

  <!-- Page node -->
  <text x="40" y="88" font-size="12" fill="#374151">▼ Grid Test</text>

  <!-- Grid items -->
  <text x="60" y="112" font-size="11" fill="#374151">▼ Revenue Overview</text>
  <rect x="224" y="100" width="80" height="16" rx="2" fill="#e5e7eb"/>
  <text x="264" y="112" font-size="9" fill="#6b7280" text-anchor="middle">[0,0 6×2]</text>

  <text x="80" y="134" font-size="11" fill="#1d4ed8">title</text>
  <text x="120" y="134" font-size="10" fill="#9ca3af">— component</text>

  <text x="60" y="160" font-size="11" fill="#374151">▸ HTML</text>
  <rect x="224" y="148" width="80" height="16" rx="2" fill="#e5e7eb"/>
  <text x="264" y="160" font-size="9" fill="#6b7280" text-anchor="middle">[6,0 6×2]</text>

  <text x="60" y="186" font-size="11" fill="#374151">▸ Weekly Sales</text>
  <rect x="224" y="174" width="80" height="16" rx="2" fill="#e5e7eb"/>
  <text x="264" y="186" font-size="9" fill="#6b7280" text-anchor="middle">[0,2 12×3]</text>

  <text x="60" y="212" font-size="11" fill="#9ca3af">Empty [0,5 4×2]</text>
  <rect x="224" y="200" width="80" height="16" rx="2" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="264" y="212" font-size="9" fill="#92400e" text-anchor="middle">placeholder</text>

  <text x="60" y="238" font-size="11" fill="#374151">▸ Metric</text>
  <rect x="224" y="226" width="80" height="16" rx="2" fill="#e5e7eb"/>
  <text x="264" y="238" font-size="9" fill="#6b7280" text-anchor="middle">[4,5 8×2]</text>

  <!-- Context menu -->
  <rect x="380" y="40" width="300" height="280" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="390" y="62" font-size="12" font-weight="600" fill="#6b7280">INTERACTIONS</text>

  <!-- Grid item menu -->
  <text x="400" y="90" font-size="11" font-weight="600" fill="#374151">Grid-item context menu:</text>
  <text x="420" y="110" font-size="11" fill="#374151">Move up / Move down</text>
  <text x="420" y="130" font-size="11" fill="#374151">Split horizontally</text>
  <text x="420" y="150" font-size="11" fill="#374151">Split vertically</text>
  <text x="420" y="170" font-size="11" fill="#374151">Delete</text>

  <!-- Action buttons -->
  <text x="400" y="200" font-size="11" font-weight="600" fill="#374151">Action buttons:</text>

  <rect x="420" y="210" width="20" height="20" rx="4" fill="white" stroke="#d1d5db"/>
  <text x="430" y="224" font-size="11" fill="#6b7280" text-anchor="middle">+</text>
  <text x="450" y="224" font-size="10" fill="#9ca3af">Set component</text>

  <rect x="420" y="236" width="20" height="20" rx="4" fill="white" stroke="#d1d5db"/>
  <text x="430" y="250" font-size="11" fill="#6b7280" text-anchor="middle">↓</text>
  <text x="450" y="250" font-size="10" fill="#9ca3af">Insert before/after</text>

  <!-- Insert flow -->
  <text x="400" y="280" font-size="11" font-weight="600" fill="#374151">Insert picker (on ↓):</text>
  <rect x="420" y="288" width="20" height="20" rx="4" fill="white" stroke="#d1d5db"/>
  <text x="430" y="302" font-size="11" fill="#6b7280" text-anchor="middle">⬆</text>
  <rect x="446" y="288" width="20" height="20" rx="4" fill="white" stroke="#d1d5db"/>
  <text x="456" y="302" font-size="11" fill="#6b7280" text-anchor="middle">⬇</text>
  <text x="476" y="302" font-size="10" fill="#9ca3af">Creates empty placement</text>
</svg>
