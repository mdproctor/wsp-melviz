  <text class="deleted-text" x="477" y="364" text-anchor="middle" font-size="11" fill="#dc2626">grid-edit-bridge: rows/columns migration branches</text>

  <!-- Arrows showing dependency cascade -->
  <line class="arrow-line" x1="125" y1="210" x2="125" y2="236" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="230" y1="130" x2="253" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="465" y1="130" x2="488" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="360" y1="180" x2="360" y2="236" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="595" y1="210" x2="595" y2="236" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text class="note-text" x="360" y="410" text-anchor="middle" font-size="11" fill="#64748b">Red = deleted  |  Blue = converted  |  Arrows = import dependency</text>
