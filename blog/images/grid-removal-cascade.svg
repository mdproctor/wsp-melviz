  <rect class="deleted" x="559" y="298" width="128" height="20" rx="3" fill="#fef2f2" stroke="#fecaca"/>
  <text class="deleted-text" x="623" y="312" text-anchor="middle" font-size="11" fill="#dc2626">preview-transform</text>
  <rect class="deleted" x="267" y="324" width="420" height="20" rx="3" fill="#fef2f2" stroke="#fecaca"/>
  <text class="deleted-text" x="477" y="338" text-anchor="middle" font-size="11" fill="#dc2626">builder-shell: path resolution, insert handlers, property panel, catalog entry (~254 lines)</text>
