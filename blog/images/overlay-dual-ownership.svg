<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Before: Dual Ownership</text>

  <!-- Shell / Overlay Root box -->
  <rect x="20" y="50" width="340" height="130" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="40" y="72" font-size="12" font-weight="600" fill="#1e40af">Shell (overlay-root)</text>
  <rect x="40" y="84" width="140" height="36" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="110" y="107" text-anchor="middle" font-size="11" fill="#1e40af">SelectionOverlay</text>
  <rect x="200" y="84" width="140" height="36" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="270" y="102" text-anchor="middle" font-size="11" fill="#1e40af">⋮ trigger</text>
  <text x="270" y="114" text-anchor="middle" font-size="9" fill="#64748b">+ action buttons</text>
  <text x="190" y="150" text-anchor="middle" font-size="10" fill="#64748b">Created in rAF after click</text>
  <text x="190" y="164" text-anchor="middle" font-size="10" fill="#dc2626">~16ms delay</text>

  <!-- Controller / Grid Item box -->
  <rect x="420" y="50" width="340" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="440" y="72" font-size="12" font-weight="600" fill="#166534">Controller (grid item)</text>
  <rect x="440" y="84" width="140" height="36" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="510" y="107" text-anchor="middle" font-size="11" fill="#166534">Drag handle bar</text>
  <rect x="600" y="84" width="140" height="36" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="670" y="102" text-anchor="middle" font-size="11" fill="#166534">⇵ ⇄ buttons</text>
  <text x="670" y="114" text-anchor="middle" font-size="9" fill="#64748b">displace / swap</text>
  <text x="590" y="150" text-anchor="middle" font-size="10" fill="#64748b">Created on pointerdown</text>
  <text x="590" y="164" text-anchor="middle" font-size="10" fill="#166534">instant</text>

  <!-- Conflict arrow -->
  <line x1="340" y1="102" x2="440" y2="102" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-red)"/>
  <text x="390" y="92" text-anchor="middle" font-size="9" fill="#dc2626">timing gap</text>

  <!-- After section -->
  <text x="390" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">After: Single Owner</text>

  <rect x="170" y="248" width="440" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="190" y="270" font-size="12" font-weight="600" fill="#166534">Controller (grid item) — unified bar</text>
  <rect x="190" y="282" width="100" height="30" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="240" y="301" text-anchor="middle" font-size="11" fill="#166534">⇵ ⇄</text>
  <rect x="310" y="282" width="80" height="30" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="350" y="301" text-anchor="middle" font-size="11" fill="#166534">⋮</text>
  <rect x="410" y="282" width="180" height="30" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="500" y="301" text-anchor="middle" font-size="11" fill="#166534">⬌ ⬍ ⊞ ✕ +</text>

  <text x="390" y="340" text-anchor="middle" font-size="10" fill="#166534">One element. One display toggle. Zero timing gaps.</text>
</svg>
