<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, system-ui, sans-serif">
  <style>
    .box { rx: 8; ry: 8; stroke-width: 1.5; }
    .shallow { fill: #1e293b; stroke: #f59e0b; }
    .deep { fill: #1e293b; stroke: #22c55e; }
    .container { fill: #0f172a; stroke: #475569; stroke-dasharray: 4; }
    .label { fill: #f1f5f9; font-size: 13px; text-anchor: middle; }
    .sublabel { fill: #94a3b8; font-size: 10px; text-anchor: middle; }
    .heading { fill: #94a3b8; font-size: 11px; font-weight: 600; text-anchor: start; }
    .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    .arrow-warn { stroke: #f59e0b; stroke-width: 1.5; fill: none; marker-end: url(#arr-warn); }
    .arrow-ok { stroke: #22c55e; stroke-width: 1.5; fill: none; marker-end: url(#arr-ok); }
    .verdict { font-size: 12px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arr-warn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arr-ok" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Shallow tests (before) -->
  <text x="20" y="30" class="heading">BEFORE — DOM presence only</text>

  <rect x="30" y="45" width="130" height="45" class="box shallow"/>
  <text x="95" y="65" class="label">Playwright test</text>
  <text x="95" y="78" class="sublabel">waitForSelector</text>

  <line x1="160" y1="67" x2="210" y2="67" class="arrow-warn"/>

  <rect x="210" y="45" width="130" height="45" class="box shallow"/>
  <text x="275" y="65" class="label">DOM node</text>
  <text x="275" y="78" class="sublabel">[data-component-type]</text>

  <line x1="340" y1="67" x2="390" y2="67" class="arrow" style="stroke-dasharray: 4;"/>
  <text x="365" y="58" style="fill: #ef4444; font-size: 9px; text-anchor: middle;">skipped</text>

  <rect x="390" y="40" width="300" height="55" class="container"/>
  <text x="540" y="58" class="label" style="fill: #64748b;">carousel / stack container</text>

  <rect x="405" y="62" width="120" height="28" class="box shallow"/>
  <text x="465" y="80" class="sublabel">pages-pie-chart</text>

  <rect x="545" y="62" width="130" height="28" class="box shallow"/>
  <text x="610" y="80" class="sublabel">pages-metric</text>

  <text x="540" y="118" class="verdict" style="fill: #f59e0b;">⚠ Pass — but no data verified</text>

  <!-- Deep tests (after) -->
  <text x="20" y="170" class="heading">AFTER — data verification</text>

  <rect x="30" y="185" width="130" height="45" class="box deep"/>
  <text x="95" y="205" class="label">Playwright test</text>
  <text x="95" y="218" class="sublabel">click + waitForFunction</text>

  <line x1="160" y1="207" x2="210" y2="207" class="arrow-ok"/>

  <rect x="210" y="185" width="130" height="45" class="box deep"/>
  <text x="275" y="205" class="label">Navigate slide</text>
  <text x="275" y="218" class="sublabel">[data-carousel-next]</text>

  <line x1="340" y1="207" x2="390" y2="207" class="arrow-ok"/>

  <rect x="390" y="180" width="300" height="55" class="container" style="stroke: #22c55e;"/>
  <text x="540" y="198" class="label" style="fill: #22c55e;">enters container</text>

  <rect x="405" y="202" width="120" height="28" class="box deep"/>
  <text x="465" y="220" class="sublabel">shadowRoot canvas</text>

  <rect x="545" y="202" width="130" height="28" class="box deep"/>
  <text x="610" y="220" class="sublabel">dataSet !== null</text>

  <text x="540" y="258" class="verdict" style="fill: #22c55e;">✓ Pass — data confirmed rendered</text>

  <!-- YAML section -->
  <text x="20" y="300" class="heading">YAML — semantic vs visual equivalence</text>

  <rect x="30" y="315" width="200" height="55" class="box shallow"/>
  <text x="130" y="335" class="label">PyYAML dump()</text>
  <text x="130" y="350" class="sublabel">"\"series\": {\n  \"label\"..."</text>
  <text x="130" y="362" class="sublabel" style="fill: #f59e0b;">semantically correct, unreadable</text>

  <line x1="250" y1="342" x2="310" y2="342" class="arrow-ok"/>
  <text x="280" y="334" style="fill: #94a3b8; font-size: 9px; text-anchor: middle;">targeted fix</text>

  <rect x="310" y="315" width="200" height="55" class="box deep"/>
  <text x="410" y="335" class="label">Block scalar (| or |-)</text>
  <text x="410" y="350" class="sublabel">"series": { "label": ... }</text>
  <text x="410" y="362" class="sublabel" style="fill: #22c55e;">semantically correct, readable</text>

  <line x1="530" y1="342" x2="580" y2="342" class="arrow-ok"/>

  <rect x="580" y="320" width="120" height="45" class="box deep"/>
  <text x="640" y="340" class="label">JSON compare</text>
  <text x="640" y="353" class="sublabel" style="fill: #22c55e;">verified identical</text>
</svg>
