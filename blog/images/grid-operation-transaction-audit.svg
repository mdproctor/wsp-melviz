<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="460" fill="#fafafa" rx="8"/>

  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Grid operations — transaction audit</text>

  <!-- Column headers -->
  <text x="40" y="60" font-size="11" font-weight="600" fill="#64748b">Operation</text>
  <text x="200" y="60" font-size="11" font-weight="600" fill="#64748b">Mutations</text>
  <text x="440" y="60" font-size="11" font-weight="600" fill="#64748b">Compaction</text>
  <text x="570" y="60" font-size="11" font-weight="600" fill="#64748b">Transaction</text>

  <line x1="30" y1="68" x2="690" y2="68" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 1: move/resize — fixed in #698 -->
  <rect x="30" y="75" width="660" height="36" rx="4" fill="#dcfce7"/>
  <text x="40" y="98" font-size="12" fill="#166534" font-weight="500">move / resize</text>
  <text x="200" y="98" font-size="11" fill="#334155">N × setPlacement + compaction</text>
  <text x="440" y="98" font-size="11" fill="#334155">yes</text>
  <rect x="560" y="82" width="60" height="22" rx="4" fill="#16a34a"/>
  <text x="590" y="97" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">#698</text>
  <text x="630" y="98" font-size="11" fill="#16a34a">✓</text>

  <!-- Row 2: merge — fixed in #701 -->
  <rect x="30" y="117" width="660" height="36" rx="4" fill="#dcfce7"/>
  <text x="40" y="140" font-size="12" fill="#166534" font-weight="500">merge</text>
  <text x="200" y="140" font-size="11" fill="#334155">N × removeItem + setPlacement + compaction</text>
  <text x="440" y="140" font-size="11" fill="#334155">yes</text>
  <rect x="560" y="124" width="60" height="22" rx="4" fill="#16a34a"/>
  <text x="590" y="139" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">#701</text>
  <text x="630" y="140" font-size="11" fill="#16a34a">✓</text>

  <!-- Row 3: remove — fixed in #701 -->
  <rect x="30" y="159" width="660" height="36" rx="4" fill="#dcfce7"/>
  <text x="40" y="182" font-size="12" fill="#166534" font-weight="500">remove</text>
  <text x="200" y="182" font-size="11" fill="#334155">removeItem + compaction</text>
  <text x="440" y="182" font-size="11" fill="#334155">yes</text>
  <rect x="560" y="166" width="60" height="22" rx="4" fill="#16a34a"/>
  <text x="590" y="181" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">#701</text>
  <text x="630" y="182" font-size="11" fill="#16a34a">✓</text>

  <!-- Row 4: split — still missing -->
  <rect x="30" y="201" width="660" height="36" rx="4" fill="#fee2e2"/>
  <text x="40" y="224" font-size="12" fill="#991b1b" font-weight="500">split</text>
  <text x="200" y="224" font-size="11" fill="#334155">setPlacement + addItem</text>
  <text x="440" y="224" font-size="11" fill="#334155">no</text>
  <rect x="560" y="208" width="60" height="22" rx="4" fill="#ef4444"/>
  <text x="590" y="223" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">missing</text>
  <text x="630" y="224" font-size="11" fill="#ef4444">✗</text>

  <!-- Row 5: swap — still missing -->
  <rect x="30" y="243" width="660" height="36" rx="4" fill="#fee2e2"/>
  <text x="40" y="266" font-size="12" fill="#991b1b" font-weight="500">swap</text>
  <text x="200" y="266" font-size="11" fill="#334155">setPlacement × 2</text>
  <text x="440" y="266" font-size="11" fill="#334155">no</text>
  <rect x="560" y="250" width="60" height="22" rx="4" fill="#ef4444"/>
  <text x="590" y="265" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">missing</text>
  <text x="630" y="266" font-size="11" fill="#ef4444">✗</text>

  <!-- Row 6: insert — single op, OK -->
  <rect x="30" y="285" width="660" height="36" rx="4" fill="#f1f5f9"/>
  <text x="40" y="308" font-size="12" fill="#475569" font-weight="500">insert</text>
  <text x="200" y="308" font-size="11" fill="#334155">addItem (single)</text>
  <text x="440" y="308" font-size="11" fill="#334155">no</text>
  <text x="570" y="308" font-size="11" fill="#94a3b8">n/a — atomic</text>

  <!-- Row 7: add-empty — single op, OK -->
  <rect x="30" y="327" width="660" height="36" rx="4" fill="#f1f5f9"/>
  <text x="40" y="350" font-size="12" fill="#475569" font-weight="500">add-empty</text>
  <text x="200" y="350" font-size="11" fill="#334155">addEmptyItem (single)</text>
  <text x="440" y="350" font-size="11" fill="#334155">no</text>
  <text x="570" y="350" font-size="11" fill="#94a3b8">n/a — atomic</text>

  <line x1="30" y1="375" x2="690" y2="375" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Legend -->
  <rect x="40" y="390" width="14" height="14" rx="3" fill="#dcfce7"/>
  <text x="60" y="402" font-size="11" fill="#334155">wrapped — single undo</text>

  <rect x="240" y="390" width="14" height="14" rx="3" fill="#fee2e2"/>
  <text x="260" y="402" font-size="11" fill="#334155">multi-entry undo — filed as #704</text>

  <rect x="480" y="390" width="14" height="14" rx="3" fill="#f1f5f9"/>
  <text x="500" y="402" font-size="11" fill="#334155">single mutation — no wrapping needed</text>

  <!-- Summary -->
  <text x="40" y="440" font-size="11" fill="#64748b">The boundary is not "one function call" — it is "one user-visible operation."</text>
</svg>
