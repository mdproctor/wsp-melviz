<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="720" height="280" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">GridPlacement — Discriminated Union</text>

  <!-- Before: single interface -->
  <rect x="30" y="55" width="200" height="120" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="130" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">BEFORE</text>
  <text x="130" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">interface GridPlacement</text>
  <g font-size="12" fill="#475569" font-family="monospace">
    <text x="50" y="105">x: number</text>
    <text x="50" y="123">y: number</text>
    <text x="50" y="141">w: number</text>
    <text x="50" y="159">h: number</text>
  </g>

  <!-- Arrow -->
  <line x1="245" y1="115" x2="275" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- After: union type -->
  <rect x="285" y="55" width="410" height="120" rx="8" fill="white" stroke="#2563eb" stroke-width="1.5"/>
  <text x="490" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">AFTER</text>
  <text x="490" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">type GridPlacement = Positioned | Auto</text>

  <!-- Positioned variant -->
  <rect x="300" y="92" width="180" height="72" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="390" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">mode: "positioned"</text>
  <g font-size="11" fill="#475569" font-family="monospace">
    <text x="315" y="132">x, y, w, h</text>
    <text x="315" y="150" font-family="system-ui" font-size="10" fill="#64748b">explicit coordinates</text>
  </g>

  <!-- Auto variant -->
  <rect x="500" y="92" width="180" height="72" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="590" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">mode: "auto"</text>
  <g font-size="11" fill="#475569" font-family="monospace">
    <text x="515" y="132">w, h</text>
    <text x="515" y="150" font-family="system-ui" font-size="10" fill="#64748b">CSS auto-flow places it</text>
  </g>

  <!-- Bottom: benefits -->
  <g font-size="11" fill="#64748b">
    <text x="50" y="210" font-weight="600" fill="#475569">Why a union?</text>
    <text x="50" y="230">Exhaustive switch on <tspan font-family="monospace" fill="#1e40af">mode</tspan> — TypeScript enforces every consumer handles both variants.</text>
    <text x="50" y="250">No optional fields, no NaN from <tspan font-family="monospace" fill="#dc2626">undefined + 1</tspan>, no "forgot to check" bugs.</text>
    <text x="50" y="270">One type, two modes. Backward compatible — all existing placements gain <tspan font-family="monospace" fill="#1e40af">mode: "positioned"</tspan>.</text>
  </g>
</svg>
