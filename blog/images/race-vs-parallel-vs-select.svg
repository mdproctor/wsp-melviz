<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Background -->
  <rect width="920" height="400" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Three Concurrency Patterns — Same Branches, Different Semantics</text>

  <!-- ═══════════════════════════════════════════
       PANEL 1 — parallel: (all must complete)
  ════════════════════════════════════════════ -->

  <rect x="16" y="52" width="280" height="336" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="156" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">parallel:</text>
  <text x="156" y="96" text-anchor="middle" font-size="11" fill="#888">all branches — wait for every result</text>

  <!-- Fork point -->
  <circle cx="156" cy="124" r="8" fill="#2563eb"/>
  <text x="156" y="128" text-anchor="middle" font-size="9" font-weight="700" fill="white">F</text>

  <!-- Branch A -->
  <line x1="156" y1="132" x2="76" y2="162" stroke="#2563eb" stroke-width="2"/>
  <rect x="36" y="162" width="80" height="44" fill="#dbeafe" rx="6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="76" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Branch A</text>
  <text x="76" y="196" text-anchor="middle" font-size="10" fill="#3b82f6">200ms</text>

  <!-- Branch B -->
  <line x1="156" y1="132" x2="156" y2="162" stroke="#2563eb" stroke-width="2"/>
  <rect x="116" y="162" width="80" height="44" fill="#dbeafe" rx="6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="156" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Branch B</text>
  <text x="156" y="196" text-anchor="middle" font-size="10" fill="#3b82f6">800ms</text>

  <!-- Branch C -->
  <line x1="156" y1="132" x2="236" y2="162" stroke="#2563eb" stroke-width="2"/>
  <rect x="196" y="162" width="80" height="44" fill="#dbeafe" rx="6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="236" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Branch C</text>
  <text x="236" y="196" text-anchor="middle" font-size="10" fill="#3b82f6">500ms</text>

  <!-- Join point -->
  <line x1="76" y1="206" x2="156" y2="250" stroke="#2563eb" stroke-width="2"/>
  <line x1="156" y1="206" x2="156" y2="250" stroke="#2563eb" stroke-width="2"/>
  <line x1="236" y1="206" x2="156" y2="250" stroke="#2563eb" stroke-width="2"/>
  <circle cx="156" cy="256" r="8" fill="#2563eb"/>
  <text x="156" y="260" text-anchor="middle" font-size="9" font-weight="700" fill="white">J</text>

  <!-- Timing -->
  <rect x="56" y="280" width="200" height="36" fill="#eff6ff" rx="6"/>
  <text x="156" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Completes at 800ms</text>
  <text x="156" y="310" text-anchor="middle" font-size="10" fill="#3b82f6">result = [A, B, C]</text>

  <!-- Status indicators -->
  <circle cx="56" cy="340" r="5" fill="#22c55e"/>
  <text x="66" y="344" font-size="10" fill="#555">A done</text>
  <circle cx="126" cy="340" r="5" fill="#22c55e"/>
  <text x="136" y="344" font-size="10" fill="#555">B done</text>
  <circle cx="196" cy="340" r="5" fill="#22c55e"/>
  <text x="206" y="344" font-size="10" fill="#555">C done</text>

  <!-- ═══════════════════════════════════════════
       PANEL 2 — race: (first to complete wins)
  ════════════════════════════════════════════ -->

  <rect x="320" y="52" width="280" height="336" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="460" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">race:</text>
  <text x="460" y="96" text-anchor="middle" font-size="11" fill="#888">first wins — losers cancelled</text>

  <!-- Fork point -->
  <circle cx="460" cy="124" r="8" fill="#16a34a"/>
  <text x="460" y="128" text-anchor="middle" font-size="9" font-weight="700" fill="white">F</text>

  <!-- Branch A — winner -->
  <line x1="460" y1="132" x2="380" y2="162" stroke="#16a34a" stroke-width="2"/>
  <rect x="340" y="162" width="80" height="44" fill="#dcfce7" rx="6" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Branch A</text>
  <text x="380" y="196" text-anchor="middle" font-size="10" fill="#16a34a">200ms</text>

  <!-- Branch B — cancelled -->
  <line x1="460" y1="132" x2="460" y2="162" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="420" y="162" width="80" height="44" fill="#f1f5f9" rx="6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="460" y="182" text-anchor="middle" font-size="11" fill="#94a3b8">Branch B</text>
  <text x="460" y="196" text-anchor="middle" font-size="10" fill="#cbd5e1">cancelled</text>

  <!-- Branch C — cancelled -->
  <line x1="460" y1="132" x2="540" y2="162" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="500" y="162" width="80" height="44" fill="#f1f5f9" rx="6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="540" y="182" text-anchor="middle" font-size="11" fill="#94a3b8">Branch C</text>
  <text x="540" y="196" text-anchor="middle" font-size="10" fill="#cbd5e1">cancelled</text>

  <!-- Winner arrow -->
  <line x1="380" y1="206" x2="460" y2="250" stroke="#16a34a" stroke-width="2"/>
  <circle cx="460" cy="256" r="8" fill="#16a34a"/>
  <text x="460" y="260" text-anchor="middle" font-size="9" font-weight="700" fill="white">W</text>

  <!-- Timing -->
  <rect x="360" y="280" width="200" height="36" fill="#f0fdf4" rx="6"/>
  <text x="460" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Completes at 200ms</text>
  <text x="460" y="310" text-anchor="middle" font-size="10" fill="#16a34a">result = A only</text>

  <!-- Status indicators -->
  <circle cx="360" cy="340" r="5" fill="#22c55e"/>
  <text x="370" y="344" font-size="10" fill="#555">A won</text>
  <circle cx="430" cy="340" r="5" fill="#ef4444"/>
  <text x="440" y="344" font-size="10" fill="#555">B aborted</text>
  <circle cx="510" cy="340" r="5" fill="#ef4444"/>
  <text x="520" y="344" font-size="10" fill="#555">C aborted</text>

  <!-- ═══════════════════════════════════════════
       PANEL 3 — select: (signal-based routing)
  ════════════════════════════════════════════ -->

  <rect x="624" y="52" width="280" height="336" fill="white" rx="8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="764" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#9333ea">select:</text>
  <text x="764" y="96" text-anchor="middle" font-size="11" fill="#888">signal chooses — only one branch runs</text>

  <!-- Decision point -->
  <rect x="740" y="116" width="48" height="24" fill="#9333ea" rx="4"/>
  <text x="764" y="133" text-anchor="middle" font-size="10" font-weight="700" fill="white">signal</text>

  <!-- Branch A — not selected, never runs -->
  <line x1="764" y1="140" x2="684" y2="170" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="644" y="170" width="80" height="44" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="684" y="190" text-anchor="middle" font-size="11" fill="#cbd5e1">Branch A</text>
  <text x="684" y="204" text-anchor="middle" font-size="10" fill="#e2e8f0">skipped</text>

  <!-- Branch B — selected -->
  <line x1="764" y1="140" x2="764" y2="170" stroke="#9333ea" stroke-width="2"/>
  <rect x="724" y="170" width="80" height="44" fill="#faf5ff" rx="6" stroke="#9333ea" stroke-width="2"/>
  <text x="764" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#7e22ce">Branch B</text>
  <text x="764" y="204" text-anchor="middle" font-size="10" fill="#9333ea">selected</text>

  <!-- Branch C — not selected -->
  <line x1="764" y1="140" x2="844" y2="170" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="804" y="170" width="80" height="44" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="844" y="190" text-anchor="middle" font-size="11" fill="#cbd5e1">Branch C</text>
  <text x="844" y="204" text-anchor="middle" font-size="10" fill="#e2e8f0">skipped</text>

  <!-- Result arrow -->
  <line x1="764" y1="214" x2="764" y2="250" stroke="#9333ea" stroke-width="2"/>
  <circle cx="764" cy="256" r="8" fill="#9333ea"/>
  <text x="764" y="260" text-anchor="middle" font-size="9" font-weight="700" fill="white">R</text>

  <!-- Timing -->
  <rect x="664" y="280" width="200" height="36" fill="#faf5ff" rx="6"/>
  <text x="764" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#7e22ce">No wasted work</text>
  <text x="764" y="310" text-anchor="middle" font-size="10" fill="#9333ea">result = B only</text>

  <!-- Status indicators -->
  <circle cx="664" cy="340" r="5" fill="#94a3b8"/>
  <text x="674" y="344" font-size="10" fill="#555">A idle</text>
  <circle cx="734" cy="340" r="5" fill="#22c55e"/>
  <text x="744" y="344" font-size="10" fill="#555">B ran</text>
  <circle cx="804" cy="340" r="5" fill="#94a3b8"/>
  <text x="814" y="344" font-size="10" fill="#555">C idle</text>

</svg>
