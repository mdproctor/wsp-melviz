<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Bridging Java Object to GraphQL String</text>

  <!-- Java side -->
  <rect x="20" y="52" width="220" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">ParamDescriptor (Java)</text>
  <line x1="40" y1="82" x2="220" y2="82" stroke="#cbd5e1"/>
  <text x="45" y="100" font-size="11" fill="#334155" font-family="ui-monospace, monospace">name: String</text>
  <text x="45" y="118" font-size="11" fill="#334155" font-family="ui-monospace, monospace">type: String</text>
  <text x="45" y="136" font-size="11" fill="#334155" font-family="ui-monospace, monospace">required: boolean</text>
  <text x="45" y="154" font-size="11" fill="#dc2626" font-family="ui-monospace, monospace">defaultValue: Object</text>
  <text x="45" y="172" font-size="11" fill="#dc2626" font-family="ui-monospace, monospace">enumValues: List&lt;Object&gt;</text>

  <!-- SmallRye GraphQL box -->
  <rect x="280" y="52" width="160" height="130" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="360" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">SmallRye GraphQL</text>
  <line x1="300" y1="82" x2="420" y2="82" stroke="#fca5a5"/>
  <text x="360" y="108" text-anchor="middle" font-size="11" fill="#991b1b">Object has no fields</text>
  <text x="360" y="126" text-anchor="middle" font-size="11" fill="#991b1b">and no scalar mapping</text>
  <text x="360" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">InvalidSchemaException</text>

  <!-- Arrow: Java → SmallRye (broken) -->
  <line x1="240" y1="117" x2="275" y2="117" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="4,3"/>

  <!-- Fix: bottom section -->
  <rect x="20" y="210" width="680" height="100" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="360" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Fix: @Ignore + @Source resolver</text>

  <!-- Three boxes inside fix -->
  <rect x="40" y="248" width="180" height="48" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="130" y="268" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">@Ignore on record</text>
  <text x="130" y="284" text-anchor="middle" font-size="10" fill="#166534">Hide Object fields from GQL</text>

  <rect x="250" y="248" width="200" height="48" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="350" y="268" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">@Source resolver</text>
  <text x="350" y="284" text-anchor="middle" font-size="10" fill="#166534">Re-expose as JSON String</text>

  <rect x="480" y="248" width="200" height="48" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="580" y="268" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">REST unchanged</text>
  <text x="580" y="284" text-anchor="middle" font-size="10" fill="#166534">Jackson handles Object natively</text>

  <!-- GraphQL output -->
  <rect x="480" y="52" width="220" height="130" rx="8" fill="#f8fafc" stroke="#86efac" stroke-width="1.5"/>
  <text x="590" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">GraphQL Schema (fixed)</text>
  <line x1="500" y1="82" x2="680" y2="82" stroke="#bbf7d0"/>
  <text x="500" y="100" font-size="11" fill="#334155" font-family="ui-monospace, monospace">name: String</text>
  <text x="500" y="118" font-size="11" fill="#334155" font-family="ui-monospace, monospace">type: String</text>
  <text x="500" y="136" font-size="11" fill="#334155" font-family="ui-monospace, monospace">required: Boolean</text>
  <text x="500" y="154" font-size="11" fill="#16a34a" font-family="ui-monospace, monospace">defaultValue: String</text>
  <text x="500" y="172" font-size="11" fill="#16a34a" font-family="ui-monospace, monospace">enumValues: [String]</text>

  <!-- Arrow: Fix → GraphQL output -->
  <path d="M450,272 Q470,272 470,200 Q470,117 475,117" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
</svg>
