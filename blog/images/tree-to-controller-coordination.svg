<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <style>
    .box { rx: 8; ry: 8; stroke-width: 1.5; }
    .label { font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .detail { font-size: 11px; fill: #94a3b8; }
    .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .event { font-size: 11px; fill: #38bdf8; font-style: italic; }
    .dead { stroke: #ef4444; stroke-dasharray: 6 3; opacity: 0.5; }
    .dead-label { font-size: 11px; fill: #ef4444; opacity: 0.6; }
    .new { stroke: #22c55e; }
    .new-label { font-size: 11px; fill: #22c55e; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="320" fill="#0f172a" rx="12" />

  <!-- Tree Panel -->
  <rect x="20" y="30" width="160" height="80" class="box" fill="#1e293b" stroke="#475569" />
  <text x="100" y="58" text-anchor="middle" class="label">Tree Panel</text>
  <text x="100" y="78" text-anchor="middle" class="detail">node-select event</text>

  <!-- Builder Shell -->
  <rect x="260" y="30" width="200" height="80" class="box" fill="#1e293b" stroke="#475569" />
  <text x="360" y="58" text-anchor="middle" class="label">Builder Shell</text>
  <text x="360" y="78" text-anchor="middle" class="detail">_applyPreviewHighlight()</text>

  <!-- Selection Overlay -->
  <rect x="260" y="160" width="200" height="60" class="box" fill="#1e293b" stroke="#475569" />
  <text x="360" y="185" text-anchor="middle" class="label">Selection Overlay</text>
  <text x="360" y="202" text-anchor="middle" class="detail">outline only for grid-item</text>

  <!-- Grid Edit Controller -->
  <rect x="540" y="30" width="160" height="80" class="box" fill="#1e293b" stroke="#22c55e" />
  <text x="620" y="58" text-anchor="middle" class="label">Grid Controller</text>
  <text x="620" y="78" text-anchor="middle" class="detail">_setSelectedEl()</text>

  <!-- Dead path: overlay → shell split/merge -->
  <rect x="20" y="160" width="160" height="60" class="box dead" fill="#1e293b" />
  <text x="100" y="185" text-anchor="middle" class="dead-label">split-h / split-v</text>
  <text x="100" y="202" text-anchor="middle" class="dead-label">merge (removed)</text>

  <!-- Arrow: tree → shell -->
  <path d="M 180 70 L 252 70" class="arrow" />
  <text x="216" y="62" text-anchor="middle" class="event">node-select</text>

  <!-- Arrow: shell → overlay -->
  <path d="M 360 110 L 360 152" class="arrow" />
  <text x="372" y="135" class="detail">update()</text>

  <!-- New arrow: shell → controller -->
  <path d="M 460 70 L 532 70" class="new" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-green)" />
  <text x="496" y="62" text-anchor="middle" class="new-label">pages-grid-select</text>
  <text x="496" y="90" text-anchor="middle" class="new-label">(new)</text>

  <!-- Dead arrow from overlay -->
  <path d="M 260 190 L 188 190" class="dead" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-red)" />

  <!-- Legend -->
  <line x1="30" y1="275" x2="60" y2="275" stroke="#22c55e" stroke-width="1.5" />
  <text x="68" y="279" class="new-label">New coordination path</text>
  <line x1="230" y1="275" x2="260" y2="275" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.5" />
  <text x="268" y="279" class="dead-label">Removed dead handlers</text>

  <!-- Title -->
  <text x="360" y="305" text-anchor="middle" font-size="12" fill="#64748b">Tree selection → controller coordination after overlay unification</text>
</svg>
