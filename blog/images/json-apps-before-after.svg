<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <!-- Before side -->
  <rect x="20" y="20" width="320" height="300" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="180" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#c53030">Before: Helpdesk on Quarkus</text>

  <text x="40" y="82" font-size="12" fill="#2d3748" font-weight="bold">41 Java files</text>
  <text x="40" y="102" font-size="11" fill="#4a5568">model/ — Ticket, Status, Category, Priority</text>
  <text x="40" y="120" font-size="11" fill="#4a5568">engine/ — CaseHub, dispatchers, handlers</text>
  <text x="40" y="138" font-size="11" fill="#4a5568">mcp/ — operations, enrichers, views</text>
  <text x="40" y="156" font-size="11" fill="#4a5568">push/ — WebSocket, observers, registry</text>
  <text x="40" y="174" font-size="11" fill="#4a5568">demo/ — bootstrap, injection, reset</text>
  <text x="40" y="192" font-size="11" fill="#4a5568">event/ — notification events</text>
  <text x="40" y="210" font-size="11" fill="#4a5568">+ 11 test classes</text>

  <text x="40" y="242" font-size="12" fill="#2d3748" font-weight="bold">Requires</text>
  <text x="40" y="262" font-size="11" fill="#4a5568">Maven build (~2 min)</text>
  <text x="40" y="280" font-size="11" fill="#4a5568">Quarkus deployment pipeline</text>
  <text x="40" y="298" font-size="11" fill="#4a5568">Java developer to change anything</text>

  <!-- Arrow -->
  <polygon points="365,170 385,155 385,165 415,165 415,175 385,175 385,185" fill="#2d3748"/>

  <!-- After side -->
  <rect x="380" y="20" width="320" height="300" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.5"/>
  <text x="540" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#276749">After: Helpdesk as JSON App</text>

  <text x="400" y="82" font-size="12" fill="#2d3748" font-weight="bold">4 files</text>

  <rect x="400" y="96" width="280" height="36" rx="4" fill="#fff" stroke="#276749" stroke-width="1"/>
  <text x="410" y="112" font-size="11" font-weight="bold" fill="#276749">app.yaml</text>
  <text x="500" y="112" font-size="10" fill="#4a5568">— collection schemas, field types, refs</text>

  <rect x="400" y="140" width="280" height="36" rx="4" fill="#fff" stroke="#276749" stroke-width="1"/>
  <text x="410" y="156" font-size="11" font-weight="bold" fill="#276749">helpdesk.page.yaml</text>
  <text x="540" y="156" font-size="10" fill="#4a5568">— dashboard, forms, tables</text>

  <rect x="400" y="184" width="280" height="36" rx="4" fill="#fff" stroke="#276749" stroke-width="1"/>
  <text x="410" y="200" font-size="11" font-weight="bold" fill="#276749">data/tickets.json</text>
  <text x="540" y="200" font-size="10" fill="#4a5568">— seed data</text>

  <rect x="400" y="228" width="280" height="36" rx="4" fill="#fff" stroke="#276749" stroke-width="1"/>
  <text x="410" y="244" font-size="11" font-weight="bold" fill="#276749">data/agents.json</text>
  <text x="540" y="244" font-size="10" fill="#4a5568">— seed data</text>

  <text x="400" y="288" font-size="12" fill="#2d3748" font-weight="bold">Requires</text>
  <text x="400" y="308" font-size="11" fill="#4a5568">Edit YAML, see changes in &lt;5 seconds</text>
</svg>
