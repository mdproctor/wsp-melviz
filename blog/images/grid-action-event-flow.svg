<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .label { font-size: 11px; fill: #64748b; }
    .title { font-size: 13px; font-weight: 600; fill: #1e293b; }
    .box { rx: 6; ry: 6; stroke-width: 1.5; }
    .arrow { stroke-width: 1.5; fill: none; marker-end: url(#head); }
    .dead { stroke: #ef4444; stroke-dasharray: 6 4; }
    .live { stroke: #22c55e; }
    .neutral { stroke: #94a3b8; }
    .cross { stroke: #ef4444; stroke-width: 2.5; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="head-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="head-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" class="title" font-size="14">Before (broken)</text>
  <text x="360" y="194" text-anchor="middle" class="title" font-size="14">After (fixed)</text>

  <!-- === BEFORE === -->
  <!-- Hover bar button -->
  <rect x="20" y="44" width="120" height="36" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="80" y="66" text-anchor="middle" font-size="11" fill="#334155">Hover bar button</text>

  <!-- pages-grid-action -->
  <rect x="200" y="44" width="140" height="36" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="270" y="60" text-anchor="middle" font-size="10" fill="#92400e">pages-grid-action</text>
  <text x="270" y="72" text-anchor="middle" font-size="9" fill="#92400e">{ action: 'split-h' }</text>

  <!-- _gridActionHandler -->
  <rect x="400" y="44" width="140" height="36" class="box" fill="#fee2e2" stroke="#ef4444"/>
  <text x="470" y="60" text-anchor="middle" font-size="10" fill="#991b1b">_gridActionHandler</text>
  <text x="470" y="72" text-anchor="middle" font-size="9" fill="#991b1b">!_selectedPath → return</text>

  <!-- X mark -->
  <line x1="558" y1="52" x2="574" y2="68" class="cross"/>
  <line x1="574" y1="52" x2="558" y2="68" class="cross"/>
  <text x="600" y="64" font-size="10" fill="#ef4444">silent drop</text>

  <!-- Arrows before -->
  <path d="M140,62 L195,62" class="arrow dead" marker-end="url(#head-red)"/>
  <path d="M340,62 L395,62" class="arrow dead" marker-end="url(#head-red)"/>

  <!-- === AFTER === -->
  <!-- Hover bar button -->
  <rect x="20" y="214" width="120" height="36" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="80" y="236" text-anchor="middle" font-size="11" fill="#334155">Hover bar button</text>

  <!-- pages-grid-edit -->
  <rect x="200" y="214" width="140" height="36" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="270" y="230" text-anchor="middle" font-size="10" fill="#166534">pages-grid-edit</text>
  <text x="270" y="242" text-anchor="middle" font-size="9" fill="#166534">{ type, targetIndex, ... }</text>

  <!-- _gridEditHandler -->
  <rect x="400" y="214" width="140" height="36" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="470" y="230" text-anchor="middle" font-size="10" fill="#166534">_gridEditHandler</text>
  <text x="470" y="242" text-anchor="middle" font-size="9" fill="#166534">origin: 'toolbar'</text>

  <!-- GridEditBridge -->
  <rect x="600" y="214" width="100" height="36" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="650" y="230" text-anchor="middle" font-size="10" fill="#166534">GridEditBridge</text>
  <text x="650" y="242" text-anchor="middle" font-size="9" fill="#166534">applyGridEdit()</text>

  <!-- Arrows after -->
  <path d="M140,232 L195,232" class="arrow live" marker-end="url(#head-green)"/>
  <path d="M340,232 L395,232" class="arrow live" marker-end="url(#head-green)"/>
  <path d="M540,232 L595,232" class="arrow live" marker-end="url(#head-green)"/>

  <!-- Annotation: same path as drag -->
  <text x="270" y="268" text-anchor="middle" class="label" font-size="10">same event path as move/resize drag</text>

  <!-- Divider -->
  <line x1="10" y1="170" x2="710" y2="170" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Legend -->
  <line x1="20" y1="310" x2="50" y2="310" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="314" font-size="10" fill="#64748b">broken path</text>
  <line x1="140" y1="310" x2="170" y2="310" stroke="#22c55e" stroke-width="1.5"/>
  <text x="176" y="314" font-size="10" fill="#64748b">working path</text>
</svg>
