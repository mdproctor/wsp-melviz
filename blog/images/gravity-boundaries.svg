<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #e5e5e5; }
    .label { font-size: 11px; fill: #e5e5e5; }
    .small { font-size: 10px; fill: #a3a3a3; }
    .dim { font-size: 10px; fill: #737373; }
    .box { rx: 4; }
  </style>
  <rect x="0" y="0" width="480" height="320" fill="#0f0f0f" rx="8"/>
  <!-- Section 1 -->
  <text x="20" y="25" class="dim">Section 1</text>
  <rect x="20" y="35" width="140" height="60" fill="#1a6b5a" class="box"/>
  <text x="90" y="70" text-anchor="middle" class="label">A</text>
  <rect x="170" y="35" width="200" height="30" fill="#2563eb" class="box"/>
  <text x="270" y="55" text-anchor="middle" class="label">B</text>
  <rect x="170" y="70" width="100" height="30" fill="#9333ea" class="box"/>
  <text x="220" y="90" text-anchor="middle" class="label">C</text>
  <rect x="380" y="35" width="80" height="30" fill="#dc2626" class="box"/>
  <text x="420" y="55" text-anchor="middle" class="label">D</text>
  <!-- Gravity arrows -->
  <path d="M 90 100 L 90 115" stroke="#555" stroke-width="1" marker-end="url(#garr)"/>
  <path d="M 270 100 L 270 115" stroke="#555" stroke-width="1" marker-end="url(#garr)"/>
  <path d="M 420 70 L 420 115" stroke="#555" stroke-width="1" marker-end="url(#garr)"/>
  <defs><marker id="garr" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 5 10 L 10 0 z" fill="#555"/></marker></defs>
  <!-- Break -->
  <rect x="20" y="120" width="440" height="4" fill="#333" rx="2"/>
  <text x="240" y="140" text-anchor="middle" class="small">▼ Section break — gravity boundary</text>
  <!-- Block arrows showing gravity stops -->
  <line x1="90" y1="115" x2="90" y2="120" stroke="#ef4444" stroke-width="2"/>
  <line x1="270" y1="115" x2="270" y2="120" stroke="#ef4444" stroke-width="2"/>
  <line x1="420" y1="115" x2="420" y2="120" stroke="#ef4444" stroke-width="2"/>
  <text x="350" y="115" class="dim" fill="#ef4444">⛔ stops here</text>
  <!-- Section 2 -->
  <text x="20" y="168" class="dim">Section 2</text>
  <rect x="20" y="178" width="200" height="50" fill="#b45309" class="box"/>
  <text x="120" y="208" text-anchor="middle" class="label">E</text>
  <rect x="230" y="178" width="230" height="50" fill="#059669" class="box"/>
  <text x="345" y="208" text-anchor="middle" class="label">F</text>
  <!-- Independent gravity -->
  <path d="M 120 233 L 120 248" stroke="#555" stroke-width="1" marker-end="url(#garr)"/>
  <path d="M 345 233 L 345 248" stroke="#555" stroke-width="1" marker-end="url(#garr)"/>
  <!-- Explanation -->
  <text x="240" y="275" text-anchor="middle" class="small">Panels compact within their section only</text>
  <text x="240" y="295" text-anchor="middle" class="small">Delete a panel in Section 1 — Section 2 doesn't move</text>
  <text x="240" y="310" text-anchor="middle" class="dim">Section grows if displaced panel can't fit</text>
</svg>
