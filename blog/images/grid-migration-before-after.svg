<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc" rx="8"/>

  <!-- Before panel -->
  <rect x="20" y="20" width="360" height="360" fill="#fef2f2" rx="6" stroke="#fca5a5" stroke-width="1"/>
  <text x="200" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Before: rows/columns model</text>

  <!-- Old format YAML block -->
  <rect x="40" y="70" width="320" height="120" fill="#fff" rx="4" stroke="#e5e7eb" stroke-width="1"/>
  <text x="50" y="90" font-size="11" fill="#6b7280" font-family="'SF Mono', 'Fira Code', monospace">pages:</text>
  <text x="50" y="106" font-size="11" fill="#6b7280" font-family="'SF Mono', 'Fira Code', monospace">  - rows:</text>
  <text x="50" y="122" font-size="11" fill="#6b7280" font-family="'SF Mono', 'Fira Code', monospace">    - columns:</text>
  <text x="50" y="138" font-size="11" fill="#dc2626" font-family="'SF Mono', 'Fira Code', monospace">        - span: 4</text>
  <text x="50" y="154" font-size="11" fill="#6b7280" font-family="'SF Mono', 'Fira Code', monospace">          displayer:</text>
  <text x="50" y="170" font-size="11" fill="#dc2626" font-family="'SF Mono', 'Fira Code', monospace">            type: METRIC</text>

  <!-- Old type system -->
  <rect x="40" y="210" width="320" height="50" fill="#fff" rx="4" stroke="#e5e7eb" stroke-width="1"/>
  <text x="50" y="232" font-size="11" fill="#6b7280" font-family="'SF Mono', 'Fira Code', monospace">LayoutMode = 'grid' | 'flat' | 'items'</text>
  <text x="50" y="248" font-size="11" fill="#dc2626" font-family="'SF Mono', 'Fira Code', monospace">           | 'rows' | 'columns'</text>

  <!-- Old stats -->
  <text x="50" y="290" font-size="12" fill="#991b1b">5 layout modes (2 unreachable)</text>
  <text x="50" y="308" font-size="12" fill="#991b1b">Schema accepts dead formats silently</text>
  <text x="50" y="326" font-size="12" fill="#991b1b">23 example files render empty</text>
  <text x="50" y="344" font-size="12" fill="#991b1b">288 test failures (missing DOM env)</text>
  <text x="50" y="362" font-size="12" fill="#991b1b">No paste indicators in grid mode</text>

  <!-- Arrow -->
  <line x1="395" y1="200" x2="415" y2="200" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- After panel -->
  <rect x="420" y="20" width="360" height="360" fill="#f0fdf4" rx="6" stroke="#86efac" stroke-width="1"/>
  <text x="600" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">After: unified grid model</text>

  <!-- New format YAML block -->
  <rect x="440" y="70" width="320" height="120" fill="#fff" rx="4" stroke="#e5e7eb" stroke-width="1"/>
  <text x="450" y="90" font-size="11" fill="#6b7280" font-family="'SF Mono', 'Fira Code', monospace">pages:</text>
  <text x="450" y="106" font-size="11" fill="#6b7280" font-family="'SF Mono', 'Fira Code', monospace">  - grid:</text>
  <text x="450" y="122" font-size="11" fill="#16a34a" font-family="'SF Mono', 'Fira Code', monospace">    - at: {x: 0, y: 0, w: 4, h: 1}</text>
  <text x="450" y="138" font-size="11" fill="#16a34a" font-family="'SF Mono', 'Fira Code', monospace">      type: metric</text>
  <text x="450" y="154" font-size="11" fill="#6b7280" font-family="'SF Mono', 'Fira Code', monospace">      properties:</text>
  <text x="450" y="170" font-size="11" fill="#6b7280" font-family="'SF Mono', 'Fira Code', monospace">        title: Active Sessions</text>

  <!-- New type system -->
  <rect x="440" y="210" width="320" height="35" fill="#fff" rx="4" stroke="#e5e7eb" stroke-width="1"/>
  <text x="450" y="232" font-size="11" fill="#16a34a" font-family="'SF Mono', 'Fira Code', monospace">LayoutMode = 'grid' | 'flat' | 'items'</text>

  <!-- New stats -->
  <text x="450" y="275" font-size="12" fill="#166534">3 layout modes (all reachable)</text>
  <text x="450" y="293" font-size="12" fill="#166534">Schema rejects old format with error</text>
  <text x="450" y="311" font-size="12" fill="#166534">23 example files migrated to grid:</text>
  <text x="450" y="329" font-size="12" fill="#166534">560 tests passing (0 failures)</text>
  <text x="450" y="347" font-size="12" fill="#166534">Paste indicators for all layout modes</text>
  <text x="450" y="365" font-size="12" fill="#166534">Carousel/Stack verified rendering</text>
</svg>
