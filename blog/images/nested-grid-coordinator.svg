<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#0f172a"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Controller Tree with Coordinator</text>

  <!-- Coordinator box -->
  <rect x="240" y="52" width="240" height="44" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="360" y="78" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="500">GridEditCoordinator</text>

  <!-- Root grid -->
  <rect x="40" y="130" width="640" height="240" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="152" fill="#94a3b8" font-size="11">Root Grid (12 columns)</text>

  <!-- Root controller label -->
  <rect x="540" y="136" width="120" height="22" rx="4" fill="#334155"/>
  <text x="600" y="151" text-anchor="middle" fill="#60a5fa" font-size="10">Controller A</text>

  <!-- Grid items in root -->
  <rect x="60" y="166" width="200" height="60" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="160" y="200" text-anchor="middle" fill="#e2e8f0" font-size="11">Title</text>

  <rect x="280" y="166" width="380" height="60" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="470" y="200" text-anchor="middle" fill="#e2e8f0" font-size="11">Instructions</text>

  <!-- Nested grid panel -->
  <rect x="60" y="240" width="300" height="116" rx="4" fill="#162032" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="80" y="260" fill="#94a3b8" font-size="10">Panel — Nested Grid (6 col)</text>

  <!-- Nested controller label -->
  <rect x="220" y="246" width="120" height="22" rx="4" fill="#334155"/>
  <text x="280" y="261" text-anchor="middle" fill="#60a5fa" font-size="10">Controller B</text>

  <!-- Nested items -->
  <rect x="76" y="276" width="130" height="36" rx="3" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="141" y="298" text-anchor="middle" fill="#e2e8f0" font-size="10">Nested A</text>

  <rect x="214" y="276" width="130" height="36" rx="3" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="279" y="298" text-anchor="middle" fill="#e2e8f0" font-size="10">Nested B</text>

  <rect x="76" y="320" width="268" height="26" rx="3" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="210" y="337" text-anchor="middle" fill="#e2e8f0" font-size="10">Nested C — full width</text>

  <!-- Panel D -->
  <rect x="380" y="240" width="280" height="116" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="520" y="302" text-anchor="middle" fill="#e2e8f0" font-size="11">Panel D</text>

  <!-- Coordinator → Controller A arrow -->
  <line x1="310" y1="96" x2="600" y2="134" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Coordinator → Controller B arrow -->
  <line x1="310" y1="96" x2="280" y2="244" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Cross-grid drag arrow -->
  <path d="M 520,290 C 520,360 210,370 210,340" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="388" text-anchor="middle" fill="#f59e0b" font-size="10" font-style="italic">cross-grid drag</text>
</svg>
