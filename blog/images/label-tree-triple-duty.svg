<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- Central label tree -->
  <rect x="240" y="130" width="240" height="120" rx="8" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
  <text x="360" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d3748">Label Tree</text>
  <text x="360" y="190" text-anchor="middle" font-size="12" fill="#4a5568">org/apps/helpdesk/</text>
  <text x="360" y="208" text-anchor="middle" font-size="12" fill="#4a5568">  tickets/status/OPEN</text>
  <text x="360" y="226" text-anchor="middle" font-size="12" fill="#4a5568">  tickets/category/HARDWARE</text>

  <!-- Use 1: Organization -->
  <rect x="20" y="20" width="200" height="80" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="120" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">Organization</text>
  <text x="120" y="68" text-anchor="middle" font-size="11" fill="#2b6cb0">App hierarchy</text>
  <text x="120" y="84" text-anchor="middle" font-size="11" fill="#2b6cb0">Collection scoping</text>

  <!-- Use 2: UI Data -->
  <rect x="500" y="20" width="200" height="80" rx="6" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="600" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b46c1">UI Data</text>
  <text x="600" y="68" text-anchor="middle" font-size="11" fill="#6b46c1">Dropdown values</text>
  <text x="600" y="84" text-anchor="middle" font-size="11" fill="#6b46c1">Cascading selectors</text>

  <!-- Use 3: Navigation + ACL -->
  <rect x="260" y="290" width="200" height="80" rx="6" fill="#fffff0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="360" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#b7791f">Navigation + ACL</text>
  <text x="360" y="338" text-anchor="middle" font-size="11" fill="#b7791f">Menu rendering</text>
  <text x="360" y="354" text-anchor="middle" font-size="11" fill="#b7791f">Access control boundaries</text>

  <!-- Arrows from center to uses -->
  <line x1="280" y1="160" x2="210" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="160" x2="510" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="250" x2="360" y2="288" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Annotations -->
  <text x="200" y="140" text-anchor="middle" font-size="10" fill="#718096">One structure</text>
  <text x="520" y="140" text-anchor="middle" font-size="10" fill="#718096">One structure</text>
  <text x="420" y="270" text-anchor="start" font-size="10" fill="#718096">One structure</text>
  <text x="360" y="378" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">Define once — serves three purposes without duplication</text>
</svg>
