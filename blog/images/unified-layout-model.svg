<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #e5e5e5; }
    .label { font-size: 11px; fill: #a3a3a3; }
    .code { font-size: 10px; font-family: 'SF Mono', 'Fira Code', monospace; fill: #93c5fd; }
    .dim { font-size: 10px; fill: #525252; }
    .box { rx: 6; }
  </style>
  <!-- Before: two models -->
  <rect x="20" y="20" width="300" height="220" fill="#1c1917" class="box"/>
  <text x="170" y="45" text-anchor="middle" class="title">Before: Two Models</text>
  <line x1="20" y1="55" x2="320" y2="55" stroke="#333"/>
  <!-- rows/columns -->
  <rect x="35" y="70" width="130" height="80" fill="#292524" class="box" stroke="#78350f" stroke-width="1"/>
  <text x="100" y="90" text-anchor="middle" class="label">rows / columns</text>
  <text x="100" y="108" text-anchor="middle" class="code">span: 6</text>
  <text x="100" y="124" text-anchor="middle" class="dim">no spanning</text>
  <text x="100" y="140" text-anchor="middle" class="dim">reflow at parse time</text>
  <!-- items -->
  <rect x="175" y="70" width="130" height="80" fill="#292524" class="box" stroke="#1e3a5f" stroke-width="1"/>
  <text x="240" y="90" text-anchor="middle" class="label">items / placement</text>
  <text x="240" y="108" text-anchor="middle" class="code">x, y, w, h</text>
  <text x="240" y="124" text-anchor="middle" class="dim">full spanning</text>
  <text x="240" y="140" text-anchor="middle" class="dim">explicit coords</text>
  <!-- confusion -->
  <text x="170" y="175" text-anchor="middle" class="dim">Two vocabularies, same runtime</text>
  <text x="170" y="195" text-anchor="middle" class="dim">Mutual exclusion at page level</text>
  <text x="170" y="215" text-anchor="middle" class="dim">LLMs must learn both</text>
  <!-- Arrow -->
  <path d="M 335 130 L 385 130" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker></defs>
  <!-- After: one model -->
  <rect x="400" y="20" width="300" height="220" fill="#1c1917" class="box"/>
  <text x="550" y="45" text-anchor="middle" class="title">After: One Model</text>
  <line x1="400" y1="55" x2="700" y2="55" stroke="#333"/>
  <rect x="435" y="70" width="230" height="100" fill="#292524" class="box" stroke="#10b981" stroke-width="1.5"/>
  <text x="550" y="92" text-anchor="middle" class="label" fill="#e5e5e5">items</text>
  <text x="550" y="114" text-anchor="middle" class="code">{ w: 6 }              auto-flow</text>
  <text x="550" y="132" text-anchor="middle" class="code">{ x:0, y:0, w:6, h:2 } pinned</text>
  <text x="550" y="150" text-anchor="middle" class="code">{ w: 8 }              spanning</text>
  <text x="550" y="190" text-anchor="middle" class="dim">One vocabulary, one model</text>
  <text x="550" y="210" text-anchor="middle" class="dim">Auto-flow + positioned in same array</text>
  <text x="550" y="230" text-anchor="middle" class="dim">Shorter YAML, no limitations</text>
</svg>
