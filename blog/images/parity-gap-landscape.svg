<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="critGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="highGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="medGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="lowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="parityGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Runtime Parity Landscape — 27 Gaps Across 3 Drift Zones</text>

  <!-- Full Parity column -->
  <rect x="30" y="52" width="160" height="370" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="110" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Full Parity</text>

  <rect x="42" y="90" width="136" height="26" rx="4" fill="url(#parityGrad)"/>
  <text x="110" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="white">Module system</text>
  <rect x="42" y="122" width="136" height="26" rx="4" fill="url(#parityGrad)"/>
  <text x="110" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="white">Orchestration (15)</text>
  <rect x="42" y="154" width="136" height="26" rx="4" fill="url(#parityGrad)"/>
  <text x="110" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="white">Simulation runtime</text>
  <rect x="42" y="186" width="136" height="26" rx="4" fill="url(#parityGrad)"/>
  <text x="110" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="white">Scenario engine</text>
  <rect x="42" y="218" width="136" height="26" rx="4" fill="url(#parityGrad)"/>
  <text x="110" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="white">Plugin / catalog</text>
  <rect x="42" y="250" width="136" height="26" rx="4" fill="url(#parityGrad)"/>
  <text x="110" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="white">Promotable decorators</text>
  <rect x="42" y="282" width="136" height="26" rx="4" fill="url(#parityGrad)"/>
  <text x="110" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="white">Combined-key parsing</text>
  <rect x="42" y="314" width="136" height="26" rx="4" fill="url(#parityGrad)"/>
  <text x="110" y="332" text-anchor="middle" font-size="11" font-weight="600" fill="white">Condition evaluation</text>
  <rect x="42" y="346" width="136" height="26" rx="4" fill="url(#parityGrad)"/>
  <text x="110" y="364" text-anchor="middle" font-size="11" font-weight="600" fill="white">Portability system</text>
  <rect x="42" y="378" width="136" height="26" rx="4" fill="url(#parityGrad)"/>
  <text x="110" y="396" text-anchor="middle" font-size="11" font-weight="600" fill="white">Front matter</text>

  <!-- Zone 1: Incremental features -->
  <rect x="210" y="52" width="170" height="370" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="295" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Zone 1</text>
  <text x="295" y="86" text-anchor="middle" font-size="10" fill="#991b1b">Incremental features</text>

  <rect x="222" y="98" width="146" height="22" rx="4" fill="url(#critGrad)"/>
  <text x="295" y="114" text-anchor="middle" font-size="10" font-weight="600" fill="white">annotations field (C4)</text>
  <rect x="222" y="126" width="146" height="22" rx="4" fill="url(#highGrad)"/>
  <text x="295" y="142" text-anchor="middle" font-size="10" font-weight="600" fill="white">Annotation system (H1)</text>
  <rect x="222" y="154" width="146" height="22" rx="4" fill="url(#highGrad)"/>
  <text x="295" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="white">Test infra (H4)</text>
  <rect x="222" y="182" width="146" height="22" rx="4" fill="url(#highGrad)"/>
  <text x="295" y="198" text-anchor="middle" font-size="10" font-weight="600" fill="white">Typed errors (H3)</text>
  <rect x="222" y="210" width="146" height="22" rx="4" fill="url(#highGrad)"/>
  <text x="295" y="226" text-anchor="middle" font-size="10" font-weight="600" fill="white">Agent sessions (H5)</text>
  <rect x="222" y="238" width="146" height="22" rx="4" fill="url(#highGrad)"/>
  <text x="295" y="254" text-anchor="middle" font-size="10" font-weight="600" fill="white">Missing keywords (H6)</text>
  <rect x="222" y="266" width="146" height="22" rx="4" fill="url(#medGrad)"/>
  <text x="295" y="282" text-anchor="middle" font-size="10" font-weight="600" fill="white">SimulateBlockParser (M6)</text>
  <rect x="222" y="294" width="146" height="22" rx="4" fill="url(#medGrad)"/>
  <text x="295" y="310" text-anchor="middle" font-size="10" font-weight="600" fill="white">ControlStep (M4)</text>
  <rect x="222" y="322" width="146" height="22" rx="4" fill="url(#medGrad)"/>
  <text x="295" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="white">pools: / orchestration: (M3)</text>
  <rect x="222" y="350" width="146" height="22" rx="4" fill="url(#lowGrad)"/>
  <text x="295" y="366" text-anchor="middle" font-size="10" font-weight="600" fill="white">OnComplete drift (L1)</text>
  <rect x="222" y="378" width="146" height="22" rx="4" fill="url(#lowGrad)"/>
  <text x="295" y="394" text-anchor="middle" font-size="10" font-weight="600" fill="white">Step-viewer gaps (L2-L4)</text>

  <!-- Zone 2: Type system -->
  <rect x="400" y="52" width="160" height="370" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="480" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">Zone 2</text>
  <text x="480" y="86" text-anchor="middle" font-size="10" fill="#c2410c">Type system divergence</text>

  <rect x="412" y="98" width="136" height="22" rx="4" fill="url(#highGrad)"/>
  <text x="480" y="114" text-anchor="middle" font-size="10" font-weight="600" fill="white">Expression engine (H2)</text>
  <rect x="412" y="126" width="136" height="22" rx="4" fill="url(#highGrad)"/>
  <text x="480" y="142" text-anchor="middle" font-size="10" font-weight="600" fill="white">Dual-registration (H7)</text>
  <rect x="412" y="154" width="136" height="22" rx="4" fill="url(#medGrad)"/>
  <text x="480" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="white">FusedPipeline (M5)</text>
  <rect x="412" y="182" width="136" height="22" rx="4" fill="url(#medGrad)"/>
  <text x="480" y="198" text-anchor="middle" font-size="10" font-weight="600" fill="white">Loop position (M7)</text>
  <rect x="412" y="210" width="136" height="22" rx="4" fill="url(#medGrad)"/>
  <text x="480" y="226" text-anchor="middle" font-size="10" font-weight="600" fill="white">AgentBinding fields (M9)</text>

  <!-- Zone 3: Silent mismatches -->
  <rect x="580" y="52" width="160" height="370" rx="8" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <text x="660" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#a16207">Zone 3</text>
  <text x="660" y="86" text-anchor="middle" font-size="10" fill="#a16207">Silent mismatches</text>

  <rect x="592" y="98" width="136" height="22" rx="4" fill="url(#critGrad)"/>
  <text x="660" y="114" text-anchor="middle" font-size="10" font-weight="600" fill="white">_subject naming (C1)</text>
  <rect x="592" y="126" width="136" height="22" rx="4" fill="url(#critGrad)"/>
  <text x="660" y="142" text-anchor="middle" font-size="10" font-weight="600" fill="white">capture keyword (C2)</text>
  <rect x="592" y="154" width="136" height="22" rx="4" fill="url(#critGrad)"/>
  <text x="660" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="white">absorbSiblings (C3)</text>
  <rect x="592" y="182" width="136" height="22" rx="4" fill="url(#highGrad)"/>
  <text x="660" y="198" text-anchor="middle" font-size="10" font-weight="600" fill="white">Result.detail (H8)</text>
  <rect x="592" y="210" width="136" height="22" rx="4" fill="url(#medGrad)"/>
  <text x="660" y="226" text-anchor="middle" font-size="10" font-weight="600" fill="white">Combined-key M1-M2</text>
  <rect x="592" y="238" width="136" height="22" rx="4" fill="url(#medGrad)"/>
  <text x="660" y="254" text-anchor="middle" font-size="10" font-weight="600" fill="white">vars/params naming (M8)</text>

  <!-- Legend -->
  <rect x="30" y="428" width="12" height="8" rx="2" fill="url(#critGrad)"/>
  <text x="46" y="436" font-size="10" fill="#64748b">Critical (4)</text>
  <rect x="130" y="428" width="12" height="8" rx="2" fill="url(#highGrad)"/>
  <text x="146" y="436" font-size="10" fill="#64748b">High (8)</text>
  <rect x="220" y="428" width="12" height="8" rx="2" fill="url(#medGrad)"/>
  <text x="236" y="436" font-size="10" fill="#64748b">Medium (9)</text>
  <rect x="320" y="428" width="12" height="8" rx="2" fill="url(#lowGrad)"/>
  <text x="336" y="436" font-size="10" fill="#64748b">Low (4)</text>
  <rect x="420" y="428" width="12" height="8" rx="2" fill="url(#parityGrad)"/>
  <text x="436" y="436" font-size="10" fill="#64748b">Full parity (10 areas)</text>
</svg>
