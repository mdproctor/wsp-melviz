<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, system-ui, sans-serif">
  <style>
    .box { rx: 8; ry: 8; stroke-width: 1.5; }
    .trigger { fill: #1e293b; stroke: #475569; }
    .bug { fill: #1e1b2e; stroke: #7c3aed; }
    .label { fill: #f1f5f9; font-size: 13px; text-anchor: middle; }
    .sublabel { fill: #94a3b8; font-size: 10px; text-anchor: middle; }
    .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .phase { fill: #334155; font-size: 11px; font-weight: 600; text-anchor: start; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Phase labels -->
  <text x="20" y="30" class="phase" fill="#94a3b8">ORIGINAL ISSUE</text>
  <text x="20" y="150" class="phase" fill="#94a3b8">DISCOVERED DURING FIX</text>

  <!-- Row 1: Original trigger -->
  <rect x="220" y="40" width="280" height="50" class="box trigger"/>
  <text x="360" y="62" class="label">#651 Hardcoded colors</text>
  <text x="360" y="78" class="sublabel">CSS tokens, tree layout, preview contrast</text>

  <!-- Row 2-3: Discovered bugs -->
  <rect x="20" y="170" width="200" height="50" class="box bug"/>
  <text x="120" y="192" class="label">Grid editing gate</text>
  <text x="120" y="208" class="sublabel">data-grid-editing-enabled</text>

  <rect x="260" y="170" width="200" height="50" class="box bug"/>
  <text x="360" y="192" class="label">Action menu blocked</text>
  <text x="360" y="208" class="sublabel">z-index + pointer interception</text>

  <rect x="500" y="170" width="200" height="50" class="box bug"/>
  <text x="600" y="192" class="label">Duplicate handles</text>
  <text x="600" y="208" class="sublabel">dblclick → parent selection</text>

  <rect x="20" y="280" width="200" height="50" class="box bug"/>
  <text x="120" y="302" class="label">Missing compaction</text>
  <text x="120" y="318" class="sublabel">no gravity after edits</text>

  <rect x="260" y="280" width="200" height="50" class="box bug"/>
  <text x="360" y="302" class="label">Live drag compaction</text>
  <text x="360" y="318" class="sublabel">compact() chained after compactAll()</text>

  <rect x="500" y="280" width="200" height="50" class="box bug"/>
  <text x="600" y="302" class="label">Stale tree view</text>
  <text x="600" y="318" class="sublabel">Lit skipped re-render</text>

  <!-- Arrows from trigger to bugs -->
  <path d="M 280 90 L 120 165" class="arrow"/>
  <path d="M 360 90 L 360 165" class="arrow"/>
  <path d="M 440 90 L 600 165" class="arrow"/>

  <!-- Arrows between bugs (discovery chain) -->
  <path d="M 120 220 L 120 275" class="arrow"/>
  <path d="M 360 220 L 360 275" class="arrow"/>
  <path d="M 600 220 L 600 275" class="arrow"/>

  <!-- Key insight callout -->
  <rect x="180" y="370" width="360" height="36" rx="18" ry="18" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1"/>
  <text x="360" y="393" class="label" font-size="12">Key: programmatic clicks masked all 6 bugs</text>
</svg>