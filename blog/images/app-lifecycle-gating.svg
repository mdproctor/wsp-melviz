<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#0f172a"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Lifecycle Gating — Request Flow</text>

  <!-- Client box -->
  <rect x="30" y="60" width="120" height="44" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="90" y="86" text-anchor="middle" fill="#e2e8f0" font-size="12">Client</text>

  <!-- Arrow: Client → Resource -->
  <line x1="150" y1="82" x2="208" y2="82" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="179" y="74" text-anchor="middle" fill="#94a3b8" font-size="10">request</text>

  <!-- Resource layer -->
  <rect x="210" y="50" width="200" height="300" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="310" y="74" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Resource Layer</text>

  <!-- isAppEnabled check -->
  <rect x="230" y="90" width="160" height="36" rx="4" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="310" y="113" text-anchor="middle" fill="#93c5fd" font-size="11">isAppEnabled(appId)?</text>

  <!-- Enabled = true path -->
  <line x1="310" y1="126" x2="310" y2="158" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="324" y="147" fill="#4ade80" font-size="10">true</text>

  <!-- Access check -->
  <rect x="230" y="160" width="160" height="36" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="310" y="183" text-anchor="middle" fill="#e2e8f0" font-size="11">Access Policy Check</text>

  <!-- Process request -->
  <line x1="310" y1="196" x2="310" y2="228" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="230" width="160" height="36" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="310" y="253" text-anchor="middle" fill="#e2e8f0" font-size="11">Process Request</text>

  <!-- Arrow to store -->
  <line x1="390" y1="248" x2="458" y2="248" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Enabled = false path -->
  <line x1="390" y1="108" x2="458" y2="108" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="424" y="100" fill="#f87171" font-size="10">false</text>

  <!-- 404 response -->
  <rect x="460" y="90" width="120" height="36" rx="4" fill="#3b0f0f" stroke="#ef4444"/>
  <text x="520" y="113" text-anchor="middle" fill="#fca5a5" font-size="11">404 Disabled</text>

  <!-- Store -->
  <rect x="460" y="220" width="220" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="570" y="244" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Data Layer</text>

  <rect x="480" y="256" width="80" height="28" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="520" y="275" text-anchor="middle" fill="#e2e8f0" font-size="10">SQLite</text>

  <rect x="580" y="256" width="80" height="28" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="620" y="275" text-anchor="middle" fill="#e2e8f0" font-size="10">_apps</text>

  <rect x="480" y="296" width="80" height="28" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="520" y="315" text-anchor="middle" fill="#e2e8f0" font-size="10">Collections</text>

  <rect x="580" y="296" width="80" height="28" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="620" y="315" text-anchor="middle" fill="#e2e8f0" font-size="10">_pages</text>

  <!-- Key -->
  <text x="40" y="370" fill="#94a3b8" font-size="10">Data preserved when disabled — only the resource gate changes, not the store.</text>
</svg>
