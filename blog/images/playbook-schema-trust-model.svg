<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .box { rx: 8; ry: 8; stroke-width: 2; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
      .sublabel { font-size: 11px; fill: #555; }
      .cap { font-size: 11px; fill: #333; font-family: 'SF Mono', 'Fira Code', monospace; }
      .header { font-size: 16px; font-weight: 700; fill: #1a1a2e; }
      .arrow { stroke: #888; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .bracket { stroke: #aaa; stroke-width: 1.5; fill: none; }
      .risk-label { font-size: 10px; fill: #c0392b; font-weight: 600; }
      .safe-label { font-size: 10px; fill: #27ae60; font-weight: 600; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" class="header">Playbook Schema Trust Model</text>

  <!-- Shared capabilities box -->
  <rect x="220" y="50" width="280" height="80" class="box" fill="#e8f4f8" stroke="#3498db"/>
  <text x="360" y="72" text-anchor="middle" class="label">Shared Capabilities</text>
  <text x="360" y="90" text-anchor="middle" class="cap">steps  variable-resolution  decorators</text>
  <text x="360" y="105" text-anchor="middle" class="cap">control-flow  modules  concurrency  state-machine</text>

  <!-- Arrows from shared to schemas -->
  <path d="M 290 130 L 150 170" class="arrow"/>
  <path d="M 360 130 L 360 170" class="arrow"/>
  <path d="M 430 130 L 570 170" class="arrow"/>

  <!-- Client box -->
  <rect x="30" y="170" width="240" height="90" class="box" fill="#fef9e7" stroke="#f39c12"/>
  <text x="150" y="195" text-anchor="middle" class="label">client</text>
  <text x="150" y="215" text-anchor="middle" class="cap">chapters  sections  aria</text>
  <text x="150" y="232" text-anchor="middle" class="cap">spotlight  tutorials</text>
  <text x="150" y="250" text-anchor="middle" class="safe-label">UI-only — no risk-bearing caps</text>

  <!-- Assisted box -->
  <rect x="290" y="170" width="140" height="90" class="box" fill="#eafaf1" stroke="#27ae60"/>
  <text x="360" y="195" text-anchor="middle" class="label">assisted</text>
  <text x="360" y="215" text-anchor="middle" class="cap">orchestration</text>
  <text x="360" y="232" text-anchor="middle" class="cap">correlation  mcp</text>
  <text x="360" y="250" text-anchor="middle" class="safe-label">server minus risk</text>

  <!-- Server box -->
  <rect x="450" y="170" width="240" height="90" class="box" fill="#fdedec" stroke="#e74c3c"/>
  <text x="570" y="195" text-anchor="middle" class="label">server</text>
  <text x="570" y="215" text-anchor="middle" class="cap">orchestration  correlation</text>
  <text x="570" y="232" text-anchor="middle" class="cap">mcp  graphql  codegen</text>

  <!-- Risk-bearing capabilities -->
  <rect x="450" y="290" width="240" height="100" class="box" fill="#fce4ec" stroke="#c0392b" stroke-dasharray="6,3"/>
  <text x="570" y="315" text-anchor="middle" class="risk-label">RISK-BEARING CAPABILITIES</text>
  <text x="570" y="335" text-anchor="middle" class="cap">process-execution</text>
  <text x="570" y="352" text-anchor="middle" class="cap">raw-http  expression-mvel</text>
  <text x="570" y="369" text-anchor="middle" class="cap">env-access</text>

  <!-- Arrow from server to risk -->
  <path d="M 570 260 L 570 290" class="arrow"/>
  <text x="600" y="278" class="risk-label">includes</text>

  <!-- No arrow from assisted to risk — that's the point -->
  <line x1="430" y1="260" x2="460" y2="290" class="bracket" stroke-dasharray="4,4" stroke="#c0392b"/>
  <text x="410" y="285" class="risk-label" text-anchor="end">excluded</text>
</svg>
