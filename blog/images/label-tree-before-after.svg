<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <!-- Background -->
  <rect width="820" height="380" fill="#fafafa" rx="8"/>

  <!-- BEFORE side -->
  <text x="200" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">Before: Labels scattered across consumers</text>

  <!-- Consumer boxes -->
  <rect x="30" y="50" width="140" height="50" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="100" y="80" text-anchor="middle" font-size="12" fill="#1565c0">Subject Views</text>

  <rect x="200" y="50" width="140" height="50" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="270" y="80" text-anchor="middle" font-size="12" fill="#1565c0">Label Rules</text>

  <rect x="30" y="120" width="140" height="50" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="100" y="150" text-anchor="middle" font-size="12" fill="#1565c0">Case Engine</text>

  <rect x="200" y="120" width="140" height="50" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#1565c0">Project Labels</text>

  <!-- Question mark -->
  <text x="200" y="220" text-anchor="middle" font-size="28" fill="#c62828">?</text>
  <text x="200" y="245" text-anchor="middle" font-size="11" fill="#c62828">"What labels exist?"</text>
  <text x="200" y="260" text-anchor="middle" font-size="10" fill="#999">No authoritative answer</text>

  <!-- Divider -->
  <line x1="410" y1="20" x2="410" y2="360" stroke="#ddd" stroke-width="1" stroke-dasharray="4"/>

  <!-- AFTER side -->
  <text x="620" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">After: LabelRegistry as single source</text>

  <!-- LabelRegistry (central) -->
  <rect x="555" y="130" width="130" height="55" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="2"/>
  <text x="620" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">LabelRegistry</text>
  <text x="620" y="170" text-anchor="middle" font-size="10" fill="#bf360c">platform-api</text>

  <!-- Path + LabelPatternMatcher (foundation) -->
  <rect x="540" y="210" width="70" height="35" rx="4" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1"/>
  <text x="575" y="232" text-anchor="middle" font-size="10" fill="#6a1b9a">Path</text>

  <rect x="625" y="210" width="90" height="35" rx="4" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1"/>
  <text x="670" y="225" text-anchor="middle" font-size="9" fill="#6a1b9a">LabelPattern</text>
  <text x="670" y="238" text-anchor="middle" font-size="9" fill="#6a1b9a">Matcher</text>

  <!-- Consumer boxes pointing to registry -->
  <rect x="445" y="50" width="100" height="40" rx="5" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="495" y="75" text-anchor="middle" font-size="10" fill="#2e7d32">Views</text>

  <rect x="560" y="50" width="100" height="40" rx="5" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="610" y="75" text-anchor="middle" font-size="10" fill="#2e7d32">Engine</text>

  <rect x="680" y="50" width="100" height="40" rx="5" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="730" y="75" text-anchor="middle" font-size="10" fill="#2e7d32">Pages</text>

  <!-- Arrows to registry -->
  <line x1="495" y1="90" x2="590" y2="130" stroke="#66bb6a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="610" y1="90" x2="615" y2="130" stroke="#66bb6a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="730" y1="90" x2="650" y2="130" stroke="#66bb6a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Foundation arrows -->
  <line x1="600" y1="185" x2="585" y2="210" stroke="#ce93d8" stroke-width="1" marker-end="url(#arrowPurple)"/>
  <line x1="640" y1="185" x2="655" y2="210" stroke="#ce93d8" stroke-width="1" marker-end="url(#arrowPurple)"/>

  <!-- Pages detail -->
  <rect x="445" y="280" width="350" height="65" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="465" y="300" font-size="11" font-weight="bold" fill="#333">Pages consumes:</text>
  <text x="475" y="318" font-size="10" fill="#666">app.yaml → LabelRegistry.register()</text>
  <text x="475" y="333" font-size="10" fill="#666">ref: labels/{tree} → LabelApi.children()</text>

  <line x1="620" y1="260" x2="620" y2="280" stroke="#999" stroke-width="1" stroke-dasharray="3"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#66bb6a" stroke-width="1"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#ce93d8" stroke-width="1"/>
    </marker>
  </defs>
</svg>
