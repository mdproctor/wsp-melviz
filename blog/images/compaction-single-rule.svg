<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#e4e4e7">Single-Rule Compaction Algorithm</text>

  <!-- Step 1: Fix moved item -->
  <rect x="20" y="50" width="200" height="240" rx="8" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <text x="120" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">1. Fix moved item</text>
  <!-- Grid -->
  <rect x="40" y="90" width="72" height="36" rx="4" fill="#9333ea" opacity="0.9"/>
  <text x="76" y="113" text-anchor="middle" font-size="10" fill="white">moved</text>
  <rect x="120" y="90" width="80" height="36" rx="4" fill="#475569"/>
  <text x="160" y="113" text-anchor="middle" font-size="10" fill="#94a3b8">B</text>
  <rect x="40" y="134" width="80" height="36" rx="4" fill="#475569"/>
  <text x="80" y="157" text-anchor="middle" font-size="10" fill="#94a3b8">C</text>
  <rect x="40" y="178" width="160" height="36" rx="4" fill="#475569"/>
  <text x="120" y="201" text-anchor="middle" font-size="10" fill="#94a3b8">D</text>
  <!-- Caption -->
  <text x="120" y="240" text-anchor="middle" font-size="10" fill="#64748b">Moved item is an</text>
  <text x="120" y="254" text-anchor="middle" font-size="10" fill="#64748b">immovable obstacle</text>

  <!-- Arrow 1→2 -->
  <line x1="225" y1="170" x2="255" y2="170" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Sort by y -->
  <rect x="260" y="50" width="200" height="240" rx="8" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <text x="360" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">2. Sort rest by y, then x</text>
  <!-- Sorted list -->
  <rect x="290" y="90" width="140" height="28" rx="4" fill="none" stroke="#475569" stroke-width="1"/>
  <text x="360" y="109" text-anchor="middle" font-size="10" fill="#94a3b8">B (y=0, x=4)</text>
  <rect x="290" y="124" width="140" height="28" rx="4" fill="none" stroke="#475569" stroke-width="1"/>
  <text x="360" y="143" text-anchor="middle" font-size="10" fill="#94a3b8">C (y=1, x=0)</text>
  <rect x="290" y="158" width="140" height="28" rx="4" fill="none" stroke="#475569" stroke-width="1"/>
  <text x="360" y="177" text-anchor="middle" font-size="10" fill="#94a3b8">D (y=3, x=0)</text>
  <!-- Caption -->
  <text x="360" y="220" text-anchor="middle" font-size="10" fill="#64748b">Preserves relative order</text>
  <text x="360" y="234" text-anchor="middle" font-size="10" fill="#64748b">from the original layout</text>

  <!-- Arrow 2→3 -->
  <line x1="465" y1="170" x2="495" y2="170" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Place at lowest y -->
  <rect x="500" y="50" width="200" height="240" rx="8" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <text x="600" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">3. Place at lowest valid y</text>
  <!-- Result grid -->
  <rect x="520" y="90" width="72" height="36" rx="4" fill="#9333ea" opacity="0.9"/>
  <text x="556" y="113" text-anchor="middle" font-size="10" fill="white">moved</text>
  <rect x="600" y="90" width="80" height="36" rx="4" fill="#059669"/>
  <text x="640" y="113" text-anchor="middle" font-size="10" fill="white">B → y=0</text>
  <rect x="520" y="134" width="80" height="36" rx="4" fill="#059669"/>
  <text x="560" y="157" text-anchor="middle" font-size="10" fill="white">C → y=1</text>
  <rect x="520" y="178" width="160" height="36" rx="4" fill="#059669"/>
  <text x="600" y="201" text-anchor="middle" font-size="10" fill="white">D → y=2</text>
  <!-- Caption -->
  <text x="600" y="240" text-anchor="middle" font-size="10" fill="#22c55e">Each item: try y=0, y=1, ...</text>
  <text x="600" y="254" text-anchor="middle" font-size="10" fill="#22c55e">until no overlap with placed</text>

  <!-- Bottom annotation -->
  <text x="360" y="308" text-anchor="middle" font-size="11" fill="#64748b">Same algorithm for move, resize expand, resize shrink, and delete. No special cases.</text>
</svg>
