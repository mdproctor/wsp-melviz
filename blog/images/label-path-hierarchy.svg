<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <rect width="650" height="340" fill="#fafafa" rx="8"/>

  <text x="325" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">Label paths encode hierarchy — no parent-child table needed</text>

  <!-- Root -->
  <rect x="265" y="48" width="120" height="36" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="2"/>
  <text x="325" y="71" text-anchor="middle" font-weight="bold" font-size="12" fill="#e65100">helpdesk</text>

  <!-- Level 1 -->
  <rect x="100" y="120" width="120" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="160" y="143" text-anchor="middle" font-size="12" fill="#1565c0">categories</text>

  <rect x="430" y="120" width="120" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="490" y="143" text-anchor="middle" font-size="12" fill="#1565c0">priorities</text>

  <!-- Level 2 under categories -->
  <rect x="30" y="195" width="90" height="32" rx="5" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="75" y="215" text-anchor="middle" font-size="11" fill="#2e7d32">HARDWARE</text>

  <rect x="145" y="195" width="90" height="32" rx="5" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="190" y="215" text-anchor="middle" font-size="11" fill="#2e7d32">SOFTWARE</text>

  <!-- Level 2 under priorities -->
  <rect x="375" y="195" width="55" height="32" rx="5" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="402" y="215" text-anchor="middle" font-size="11" fill="#2e7d32">P1</text>

  <rect x="445" y="195" width="55" height="32" rx="5" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="472" y="215" text-anchor="middle" font-size="11" fill="#2e7d32">P2</text>

  <rect x="515" y="195" width="55" height="32" rx="5" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="542" y="215" text-anchor="middle" font-size="11" fill="#2e7d32">P3</text>

  <rect x="585" y="195" width="55" height="32" rx="5" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="612" y="215" text-anchor="middle" font-size="11" fill="#2e7d32">P4</text>

  <!-- Level 3 leaves -->
  <rect x="10" y="265" width="70" height="28" rx="4" fill="#fce4ec" stroke="#ef9a9a" stroke-width="1"/>
  <text x="45" y="283" text-anchor="middle" font-size="10" fill="#c62828">Laptops</text>

  <rect x="90" y="265" width="70" height="28" rx="4" fill="#fce4ec" stroke="#ef9a9a" stroke-width="1"/>
  <text x="125" y="283" text-anchor="middle" font-size="10" fill="#c62828">Monitors</text>

  <rect x="175" y="265" width="45" height="28" rx="4" fill="#fce4ec" stroke="#ef9a9a" stroke-width="1"/>
  <text x="197" y="283" text-anchor="middle" font-size="10" fill="#c62828">OS</text>

  <rect x="230" y="265" width="45" height="28" rx="4" fill="#fce4ec" stroke="#ef9a9a" stroke-width="1"/>
  <text x="252" y="283" text-anchor="middle" font-size="10" fill="#c62828">Apps</text>

  <rect x="365" y="265" width="55" height="28" rx="4" fill="#fce4ec" stroke="#ef9a9a" stroke-width="1"/>
  <text x="392" y="283" text-anchor="middle" font-size="10" fill="#c62828">Critical</text>

  <rect x="430" y="265" width="55" height="28" rx="4" fill="#fce4ec" stroke="#ef9a9a" stroke-width="1"/>
  <text x="457" y="283" text-anchor="middle" font-size="10" fill="#c62828">Blocker</text>

  <!-- Connecting lines -->
  <line x1="325" y1="84" x2="160" y2="120" stroke="#bbb" stroke-width="1.2"/>
  <line x1="325" y1="84" x2="490" y2="120" stroke="#bbb" stroke-width="1.2"/>

  <line x1="130" y1="156" x2="75" y2="195" stroke="#bbb" stroke-width="1"/>
  <line x1="190" y1="156" x2="190" y2="195" stroke="#bbb" stroke-width="1"/>

  <line x1="460" y1="156" x2="402" y2="195" stroke="#bbb" stroke-width="1"/>
  <line x1="490" y1="156" x2="472" y2="195" stroke="#bbb" stroke-width="1"/>
  <line x1="515" y1="156" x2="542" y2="195" stroke="#bbb" stroke-width="1"/>
  <line x1="520" y1="156" x2="612" y2="195" stroke="#bbb" stroke-width="1"/>

  <line x1="55" y1="227" x2="45" y2="265" stroke="#bbb" stroke-width="1"/>
  <line x1="95" y1="227" x2="125" y2="265" stroke="#bbb" stroke-width="1"/>
  <line x1="175" y1="227" x2="197" y2="265" stroke="#bbb" stroke-width="1"/>
  <line x1="205" y1="227" x2="252" y2="265" stroke="#bbb" stroke-width="1"/>

  <line x1="392" y1="227" x2="392" y2="265" stroke="#bbb" stroke-width="1"/>
  <line x1="412" y1="227" x2="457" y2="265" stroke="#bbb" stroke-width="1"/>

  <!-- Path annotation -->
  <text x="325" y="328" text-anchor="middle" font-size="11" fill="#888" font-style="italic">helpdesk/categories/HARDWARE/Laptops → registered as a single path string</text>
</svg>
