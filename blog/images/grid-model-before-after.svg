<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="system-ui, sans-serif">
  <!-- Before: rows/columns model -->
  <text x="200" y="24" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">Before: rows / columns</text>
  <rect x="20" y="36" width="360" height="260" rx="8" fill="#f9fafb" stroke="#d1d5db"/>

  <!-- Page -->
  <text x="40" y="60" font-size="12" fill="#6b7280">page:</text>

  <!-- Row 1 -->
  <rect x="40" y="70" width="320" height="80" rx="4" fill="none" stroke="#9ca3af" stroke-dasharray="4"/>
  <text x="50" y="86" font-size="11" fill="#9ca3af">row</text>

  <!-- Col 1 -->
  <rect x="50" y="94" width="148" height="48" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="124" y="122" font-size="11" fill="#1d4ed8" text-anchor="middle">column (6)</text>

  <!-- Col 2 -->
  <rect x="206" y="94" width="148" height="48" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="280" y="122" font-size="11" fill="#1d4ed8" text-anchor="middle">column (6)</text>

  <!-- Row 2 -->
  <rect x="40" y="160" width="320" height="50" rx="4" fill="none" stroke="#9ca3af" stroke-dasharray="4"/>
  <text x="50" y="176" font-size="11" fill="#9ca3af">row</text>

  <rect x="50" y="184" width="300" height="20" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="200" y="198" font-size="11" fill="#1d4ed8" text-anchor="middle">column (12)</text>

  <!-- Components inside -->
  <rect x="60" y="100" width="60" height="16" rx="2" fill="#1d4ed8"/>
  <text x="90" y="112" font-size="9" fill="white" text-anchor="middle">title</text>

  <rect x="130" y="100" width="60" height="16" rx="2" fill="#1d4ed8"/>
  <text x="160" y="112" font-size="9" fill="white" text-anchor="middle">chart</text>

  <text x="200" y="268" font-size="11" fill="#9ca3af" text-anchor="middle">3 structural layers · fixed vocabulary</text>

  <!-- Arrow -->
  <path d="M 400 180 L 420 180" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- After: items model -->
  <text x="620" y="24" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">After: items with placement</text>
  <rect x="440" y="36" width="340" height="260" rx="8" fill="#f9fafb" stroke="#d1d5db"/>

  <text x="460" y="60" font-size="12" fill="#6b7280">page:</text>

  <!-- Item 1 -->
  <rect x="460" y="70" width="150" height="60" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="470" y="86" font-size="10" fill="#166534">[0,0 6×2]</text>
  <rect x="470" y="94" width="60" height="16" rx="2" fill="#166534"/>
  <text x="500" y="106" font-size="9" fill="white" text-anchor="middle">title</text>

  <!-- Item 2 -->
  <rect x="618" y="70" width="150" height="60" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="628" y="86" font-size="10" fill="#166534">[6,0 6×2]</text>
  <rect x="628" y="94" width="60" height="16" rx="2" fill="#166534"/>
  <text x="658" y="106" font-size="9" fill="white" text-anchor="middle">chart</text>

  <!-- Item 3 -->
  <rect x="460" y="140" width="308" height="50" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="470" y="156" font-size="10" fill="#166534">[0,2 12×2]</text>
  <rect x="470" y="164" width="60" height="16" rx="2" fill="#166534"/>
  <text x="500" y="176" font-size="9" fill="white" text-anchor="middle">table</text>

  <!-- Empty container -->
  <rect x="460" y="200" width="150" height="40" rx="4" fill="none" stroke="#86efac" stroke-dasharray="4"/>
  <text x="535" y="224" font-size="10" fill="#166534" text-anchor="middle">[0,4 6×1] empty</text>

  <text x="620" y="268" font-size="11" fill="#9ca3af" text-anchor="middle">1 structural layer · CSS Grid coordinates</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
